function drawPrint(g, s, mask){

    g.strokeStyle = filled ? (mask ? '#000' : '#050505') : gold(); g.lineWidth = s/700;

    g.restore();

    g.save(); g.translate(x,y); g.rotate(rot); g.beginPath();
    g.moveTo(0,-size); g.quadraticCurveTo(size*.8,-size*.2,0,size*.6); g.quadraticCurveTo(-size*.8,-size*.2,0,-size);
    g.moveTo(0,size*.6); g.lineTo(size*.25,size); g.strokeStyle = gold(); g.lineWidth = s/450; g.stroke(); g.restore();
  }

    const x = r()*s, y = r()*s, rot = r()*Math.PI*2, t = r();
    for(const [dx,dy] of [[0,0],[s,0],[-s,0],[0,s],[0,-s],[s,s],[-s,-s],[s,-s],[-s,s]]){

  promoL: {he:'מגש פרומו L', title:'מגש פרומו', shape:'square', price:199, pcs:56, wedges:['sap','sat','tmy','scp','vgp','ssg'], center:'mcc'},
  promoXL:{he:'מגש פרומו XL', title:'מגש פרומו', shape:'square', price:299, pcs:80, wedges:['sap','sat','tmy','scp','vgp','ssg'], center:'mcc'},
};

// ---------- build a tray ----------
let pieces = [], groupsInst = [], pickables = [], slotsOf = [], current = null;
const o3 = new THREE.Object3D(), ZERO = new THREE.Matrix4().makeScale(0,0,0), tmpM = new THREE.Matrix4();
const PARTS = {}; const partsOf = id => PARTS[id] || (PARTS[id] = rollParts(id));
const drop = {t:1};
function build(trayId){
  finishLeaving();
  for(const im of groupsInst){ tray.remove(im); im.dispose(); }
  groupsInst = []; pickables = []; pieces = []; current = trayId;
  const T = TRAYS[trayId];
  trayRound.visible = T.shape === 'round'; traySquare.visible = T.shape === 'square';
  if(T.slots){
    T.slots.forEach(([id, x, y, r, ang], i)=>{ const [wx, wz] = px2w(x, y), sc = r*PX/outerOf(id);
      if(ang == null) pieces.push({id, x:wx, z:wz, y:FLOOR_Y + L*sc/2 + 0.02, sc, ry:i*1.7, upright:true});
      else pieces.push({id, x:wx, z:wz, y:FLOOR_Y + outerOf(id)*sc*0.97, sc, ry:-ang*Math.PI/180, rz:0}); });
  } else {
    T.wedges.forEach((id,w)=> sqWedgeSlots(w).forEach(s=>pieces.push({id, ...s})));
    if(T.center){ const sc = 1.25, d = 2*1.35*sc + 0.12; // seven maki standing in the centre well, like the real trays
      [[0,0], ...[0,1,2,3,4,5].map(k=>[Math.cos(k*Math.PI/3)*d, Math.sin(k*Math.PI/3)*d])].forEach(([x,z],i)=> pieces.push({id:T.center, x, z, y:FLOOR_Y + L*0.9*sc/2 + 0.02, sc, ry:i*1.3, upright:true})); }
  }
  slotsOf = pieces.map(()=>[]);
  const byRoll = {}; pieces.forEach((p,i)=>{ (byRoll[p.id] ||= []).push(i); });
  for(const [id, idxs] of Object.entries(byRoll)){
    for(const part of partsOf(id)){
      const im = new THREE.InstancedMesh(part.geo, TM[part.mat], idxs.length); im.castShadow = im.receiveShadow = true;
      im.userData.idxs = idxs;
      idxs.forEach((pi,j)=>{ const p = pieces[pi]; o3.position.set(p.x,p.y,p.z); o3.rotation.set(0, p.ry || 0, 0); o3.rotateZ(p.upright ? Math.PI/2 : (p.rz || 0));
        o3.scale.setScalar(p.sc); o3.updateMatrix(); p.matrix = o3.matrix.clone(); im.setMatrixAt(j, p.matrix); slotsOf[pi].push([im, j]); });
      o3.scale.setScalar(1);
      im.instanceMatrix.needsUpdate = true; im.computeBoundingSphere();
      tray.add(im); groupsInst.push(im); pickables.push(im);
    }
  }
  pieces.forEach(p=>{ p.lift = S(0); p.dy = 0; p.hidden = false; });
  placeGarnish();
  sub.textContent = trayLabel(); document.getElementById('title').textContent = T.title;
  drop.t = (reduce || !ready) ? 1 : 0; shadowDirty = true; needs();
}
function writePiece(pi){
  const p = pieces[pi]; if(!p) return;
  const dy = p.dy + p.lift.x, m = p.hidden ? ZERO : dy ? tmpM.makeTranslation(0, dy, 0).multiply(p.matrix) : p.matrix;
  for(const [im, j] of slotsOf[pi]){ im.setMatrixAt(j, m); im.instanceMatrix.needsUpdate = true; }
}
const trayLabel = ()=>{ const T = TRAYS[current]; return `${T.he} · ${T.pcs || pieces.length} יח'${T.price ? ` · ${T.price} ₪` : ''}${T.center ? '' : ` · קימצ'י במרכז`}`; };

// ---------- the picked piece: real layers you can pull apart, label and inspect one by one ----------
let hero = null, exploded = false, mode = 'tray', ready = false;
const leaving = [];
const ISO_S = 1.6, HERO_POS = new THREE.Vector3(0, 14, 12);
const portrait = () => innerWidth / innerHeight < 0.85;
// grains of rice and crumbs of panko, only on the piece you hold up close
const GRAIN = new THREE.SphereGeometry(1, 9, 6); GRAIN.scale(.2, .07, .085);
const CRUMB = new THREE.IcosahedronGeometry(1, 0); CRUMB.scale(.16, .055, .12);
const CRUMB_COLORS = {panko:['#f4ecdc','#e9dcc0','#fbf6ea','#dcc39a'], pink:['#d94f94','#ef8fbe','#f6c3da','#c23d82'], tempura:['#e9b866','#f3d08c','#d79a45','#c98a3a']};
const UP = new THREE.Vector3(0,1,0), nrm = new THREE.Vector3();
function scatter(geo, mat, n, seed, place, colors){
  const r = rng(seed), o = new THREE.Object3D(), im = new THREE.InstancedMesh(geo, mat, n), c = new THREE.Color();
  for(let i=0;i<n;i++){ place(o, r); o.updateMatrix(); im.setMatrixAt(i, o.matrix); colors ? c.set(colors[(r()*colors.length)|0]) : c.setScalar(.9 + r()*.1); im.setColorAt(i, c); }

}
const onTube = (R, len)=>(o, r)=>{ const a = r()*Math.PI*2; nrm.set(0, Math.cos(a), Math.sin(a)); o.position.set((r()-.5)*len, nrm.y*R, nrm.z*R); o.quaternion.setFromUnitVectors(UP, nrm); o.rotateY(r()*Math.PI); o.scale.setScalar(.85 + r()*.35); };

function layerDefs(id){
  const R = ROLLS[id], D = 2.5, out = [];
  if(R.maki){
    out.push({key:'nori', name:'נורי', sub:'עוטף את הרול מבחוץ', desc:'עלה אצה קלויה שעוטף את המאקי מבחוץ.', off:[0, 2.6, 0], delay:0});
    out.push({key:'rice', name:'אורז סושי', sub:'מתחת לנורי', desc:'אורז יפני עגול, מתובל בחומץ אורז, בשכבה דקה מתחת לנורי.', off:[-D, 0, 0], delay:.1});
  } else {
    if(R.coat !== 'plain'){ const [name, sub, desc] = COAT_INFO[R.coat]; out.push({key:'coat', name, sub, desc, off:[0, 2.9, 0], delay:0}); }
    out.push({key:'rice', name:'אורז סושי', sub:'מבחוץ, מתובל בחומץ', desc:'אורז יפני עגול, מבושל ומתובל בחומץ אורז, סוכר ומלח. ברול אינסייד-אאוט הוא בצד החיצוני.', off:[-2*D, 0, 0], delay:.12});
    out.push({key:'nori', name:'נורי', sub:'עוטף את המילוי', desc:'עלה אצה קלויה שמחזיק את המילוי במרכז הרול.', off:[-D, 0, 0], delay:.2});
  }
  R.fill.forEach((f,i)=>{ const [name, sub, desc] = FILL_INFO[f]; out.push({key:'f:'+f, name, sub, desc, off:[D*(i+1), i%2 ? .35 : -.35, 0], delay:.25 + i*.06}); });
  // on a narrow screen the same layers sit in two columns, outside layers first
  const rows = Math.ceil(out.length/2);
  out.forEach((Lr, i)=>{ Lr.offP = [i%2 ? 2.9 : -2.9, ((rows - 1)/2 - Math.floor(i/2))*3.7, 0]; });
  return out;
}
function buildHero(pi){
  const p = pieces[pi], R = ROLLS[p.id], parts = partsOf(p.id), sd = p.id.charCodeAt(0)*7 + p.id.charCodeAt(1);
  const root = new THREE.Group(), spin = new THREE.Group(); root.add(spin);
  const layers = layerDefs(p.id).map(d => ({...d, g:new THREE.Group(), mats:[], cache:{}, box:new THREE.Box3(), iso:S(0), fade:S(0)}));
  const byKey = Object.fromEntries(layers.map(Lr => [Lr.key, Lr]));
  const matFor = (Lr, key)=>{ if(!Lr.cache[key]){ const m = MAT[key].clone(); m.transparent = true; Lr.cache[key] = m; Lr.mats.push(m); } return Lr.cache[key]; };
  for(const Lr of layers) spin.add(Lr.g);
  let face = null;

    if(part.layer === 'face'){ const m = MAT[part.mat].clone(); m.transparent = true; face = new THREE.Mesh(part.geo, m); spin.add(face); continue; }
    const Lr = byKey[part.layer], mesh = new THREE.Mesh(part.geo, matFor(Lr, part.mat));
    mesh.castShadow = mesh.receiveShadow = true; mesh.userData.layer = Lr; Lr.g.add(mesh);
    part.geo.computeBoundingBox(); Lr.box.union(part.geo.boundingBox);
  }
  // rice grains on the rice (and on its cut faces, shown once the photo face fades), crumbs on panko and tempura
  const rice = byKey.rice, gm = matFor(rice, 'grain');
  let faceGrains;
  if(R.maki === 'veg') faceGrains = scatter(GRAIN, gm, 120, sd, onFace(1.26, .66, L*.45));
  else if(R.maki) faceGrains = scatter(GRAIN, gm, 200, sd, onFace(1.95, 1.0, L/2 - .02));
  else { const tube = scatter(GRAIN, gm, 420, sd + 1, onTube(R_RICE - .04, L - .25)); tube.userData.layer = rice; rice.g.add(tube); faceGrains = scatter(GRAIN, gm, 220, sd + 2, onFace(R_RICE - .1, R_IN + .06, L/2 - .02)); }
  faceGrains.userData.layer = rice; rice.g.add(faceGrains);
  if(CRUMB_COLORS[R.coat]){ const cm = matFor(byKey.coat, 'flake'), cr = scatter(CRUMB, cm, 520, sd + 3, onTube(R_RICE + COAT + .02, L - .15), CRUMB_COLORS[R.coat]); cr.userData.layer = byKey.coat; byKey.coat.g.add(cr); }
  for(const Lr of layers){ Lr.c = Lr.box.getCenter(new THREE.Vector3()); Lr.r = Lr.box.getSize(new THREE.Vector3()).length()/2; }
  const from = new THREE.Vector3(), q0 = new THREE.Quaternion(), scl = new THREE.Vector3(); p.matrix.decompose(from, q0, scl);
  return {pi, id:p.id, tray:current, root, spin, layers, face, faceGrains, sc:p.sc, from, q0, q1:heroQ(),
          k:S(0), kT:1, ex:S(0), pop:S(1), popT:1, turn:0, iso:-1};
}
// the held piece faces you side-on, so its photo cut face shows
function heroQ(){ return new THREE.Quaternion(); }
const offOf = Lr => portrait() ? Lr.offP : Lr.off;
const qTurn = new THREE.Quaternion(), YAX = new THREE.Vector3(0,1,0), v3 = new THREE.Vector3();
function updateHero(h, dt){
  const isCur = h === hero;
  let act = spring(h.k, h.kT, dt, 6.5);
  act = spring(h.ex, isCur && exploded ? 1 : 0, dt, 5.5) || act;
  act = spring(h.pop, h.popT, dt, 11) || act;
  const k = clamp(h.k.x, 0, 1);
  h.root.position.lerpVectors(h.from, HERO_POS, k); h.root.position.y += Math.sin(k*Math.PI)*2.2;
  h.root.quaternion.slerpQuaternions(h.q0, h.q1, k);
  // a slow turntable while the piece is whole; it turns back to face you when it comes apart
  if(isCur && !exploded && mode === 'focus' && !reduce && k > .97){ h.turn += dt*.32; act = true; }
  else { const t = Math.round(h.turn/(Math.PI*2))*Math.PI*2; if(Math.abs(t - h.turn) > 1e-3){ h.turn += (t - h.turn)*(1 - Math.exp(-dt*5)); act = true; } else h.turn = t; }
  qTurn.setFromAxisAngle(YAX, h.turn*k); h.root.quaternion.premultiply(qTurn);
  h.root.scale.setScalar(h.sc*Math.max(h.pop.x, 1e-4));
  const E = clamp(h.ex.x, 0, 1);
  h.layers.forEach((Lr, i)=>{
    act = spring(Lr.iso, isCur && h.iso === i ? 1 : 0, dt, 8) || act;
    act = spring(Lr.fade, isCur && h.iso >= 0 && h.iso !== i ? 1 : 0, dt, 8) || act;
    const e = smooth(clamp((E - Lr.delay)/.55, 0, 1)), s = 1 + (ISO_S - 1)*Lr.iso.x, o = offOf(Lr);
    Lr.g.position.set(o[0]*e + Lr.c.x*(1-s), o[1]*e + Lr.c.y*(1-s), o[2]*e + Lr.c.z*(1-s)); Lr.g.scale.setScalar(s);
    const op = 1 - Lr.fade.x; Lr.g.visible = op > .02; for(const m of Lr.mats){ m.opacity = op; m.depthWrite = op > .6; }
  });
  if(h.face){ const fo = 1 - smooth(clamp(E/.18, 0, 1)); h.face.visible = fo > .01; h.face.material.opacity = fo; h.face.material.alphaTest = Math.max(.01, .5*fo); h.faceGrains.visible = fo < .6; }

}
function disposeHero(h){
  const i = leaving.indexOf(h); if(i >= 0) leaving.splice(i, 1);
  scene.remove(h.root);
  for(const Lr of h.layers) for(const m of Lr.mats) m.dispose();
  if(h.face) h.face.material.dispose();
  h.root.traverse(o=>{ if(o.isInstancedMesh) o.dispose(); });
  if(h.tray === current && pieces[h.pi]){ pieces[h.pi].hidden = false; writePiece(h.pi); }
  shadowDirty = true; needs();
}
function finishLeaving(){ while(leaving.length) disposeHero(leaving[0]); }

// ---------- camera framing: fit what you are looking at into the free band between the title and the sheet ----------
const sheet = document.getElementById('sheet'), headerEl = document.querySelector('header.top');
const TRAY_TARGET = new THREE.Vector3(0, 2, 0);
const VIEWS = { angle: ()=> new THREE.Vector3(22, 46, 50).multiplyScalar(portrait() ? 1.5 : 1),
                top:   ()=> new THREE.Vector3(0, portrait()? 120 : 82, 0.001),
                low:   ()=> new THREE.Vector3(0, 16, 46).multiplyScalar(portrait() ? 1.45 : 1) };
let view = 'angle';
function band(){
  const hb = mode === 'tray' ? headerEl.querySelector('.tools').getBoundingClientRect().bottom : headerEl.querySelector('.sub').getBoundingClientRect().bottom;
  const top = Math.min(hb + 8, innerHeight*.32);
  const bottom = mode === 'tray' ? innerHeight - (portrait() ? 64 : 0) : Math.max(innerHeight - sheet.offsetHeight - 8, innerHeight*.5);
  return {top, bottom};
}
// fit a set of world points into the free band, seen from direction dir: per-axis, so long thin things fill the screen
const fitBasis = {r:new THREE.Vector3(), u:new THREE.Vector3(), d:new THREE.Vector3()};
function frame(points, dir, pad=1.08){
  const {top, bottom} = band(), H = innerHeight, vf = THREE.MathUtils.degToRad(camera.fov);
  const tv = Math.tan(vf/2)*Math.max(.25, (bottom - top)/H), th = Math.tan(vf/2)*camera.aspect*.94;
  const {r, u, d} = fitBasis; d.copy(dir).normalize(); r.crossVectors(UP, d); if(r.lengthSq() < 1e-6) r.set(1, 0, 0); r.normalize(); u.crossVectors(d, r);
  const box = new THREE.Box3().setFromPoints(points), center = box.getCenter(new THREE.Vector3());
  // centre the points on screen in the camera's own right/up axes
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(const p of points){ v3.subVectors(p, center); const x = v3.dot(r), y = v3.dot(u); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  center.addScaledVector(r, (x0 + x1)/2).addScaledVector(u, (y0 + y1)/2);
  let dist = 0;
  for(const p of points){ v3.subVectors(p, center); const x = Math.abs(v3.dot(r)), y = Math.abs(v3.dot(u)), z = v3.dot(d); dist = Math.max(dist, z + x/th, z + y/tv); }
  dist *= pad; const pos = center.clone().addScaledVector(d, dist);
  cc.setLookAt(pos.x, pos.y, pos.z, center.x, center.y, center.z, true);
  const perPx = 2*dist*Math.tan(vf/2)/H, shift = ((H - bottom) - top)/2;
  cc.setFocalOffset(0, shift*perPx, 0, true); // camera-controls moves the camera down for a positive y, which lifts the subject
}
const boxPoints = b => [0,1,2,3,4,5,6,7].map(i => new THREE.Vector3(i&1 ? b.max.x : b.min.x, i&2 ? b.max.y : b.min.y, i&4 ? b.max.z : b.min.z));
function camDir(){ const p = cc.getPosition(new THREE.Vector3(), true), t = cc.getTarget(new THREE.Vector3(), true); return p.sub(t).normalize(); }
const heroDir = ()=> new THREE.Vector3(6.2, 3.4, 8.6).normalize();
function heroPoints(h){
  const out = [], c = new THREE.Vector3();
  for(const [i, Lr] of h.layers.entries()){ if(h.iso >= 0 && i !== h.iso) continue;
    const s = h.iso >= 0 ? ISO_S : 1, half = Lr.box.getSize(new THREE.Vector3()).multiplyScalar(s/2);
    c.copy(Lr.c); if(exploded || h.iso >= 0) c.add(new THREE.Vector3(...offOf(Lr)));
    for(const p of boxPoints(new THREE.Box3(c.clone().sub(half), c.clone().add(half)))) out.push(p.multiplyScalar(h.sc).applyQuaternion(h.q1).add(HERO_POS));
  }

}
function frameHero(initial){ if(!hero) return; frame(heroPoints(hero), initial ? heroDir() : camDir(), hero.iso >= 0 ? 1.3 : exploded ? 1.06 : 1.35); }
const TRAY_BOX = {round:new THREE.Box3(new THREE.Vector3(-20.2, 0, -20.2), new THREE.Vector3(20.2, 4.2, 20.2)), square:new THREE.Box3(new THREE.Vector3(-21, 0, -21), new THREE.Vector3(21, 4.2, 21))};
function frameTray(){
  if(!portrait()){ const p = VIEWS[view](); cc.setFocalOffset(0, 0, 0, true); cc.setLookAt(p.x, p.y, p.z, TRAY_TARGET.x, TRAY_TARGET.y, TRAY_TARGET.z, true); return; }
  const dir = view === 'top' ? new THREE.Vector3(0, 1, .001) : VIEWS[view]().normalize();
  const pts = TRAYS[current].shape === 'round' ? [...Array(32)].flatMap((_, i)=>{ const a = i/32*Math.PI*2, x = Math.cos(a)*20.1, z = Math.sin(a)*20.1; return [new THREE.Vector3(x, 0, z), new THREE.Vector3(x, 4.2, z)]; }) : boxPoints(TRAY_BOX.square);
  frame(pts, dir, 1.02);
}

// ---------- state + UI ----------
const hint = document.getElementById('hint'), sub = document.getElementById('sub');
const btnExplode = document.getElementById('btnExplode'), btnBack = document.getElementById('btnBack'), btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
const heroName = document.getElementById('heroName'), heroText = document.getElementById('heroText'), heroKicker = document.getElementById('heroKicker'), chipsEl = document.getElementById('chips');
const dimS = S(0); let dimT = 0, gObj = null;
hint.textContent = coarse ? 'גררו כדי לסובב · צבטו לזום · הקישו על רול כדי לפתוח אותו' : 'גררו כדי לסובב · גלגלת לזום · לחצו על רול כדי לפתוח אותו';
const rollBlurb = R => R.maki ? `מאקי: נורי מבחוץ, אורז, ${R.fill.map(f=>FILL_HE[f]).join(' ו')}.` : `${COAT_HE[R.coat]}. בפנים: ${R.fill.map(f=>FILL_HE[f]).join(', ')}.`;
function setMode(m){ mode = m; document.body.classList.toggle('focus', m !== 'tray'); if(m !== 'tray') setHover(-1); }
function fillSheet(rebuildChips){
  if(mode === 'garnish' && gObj){
    const [name, desc] = GARN_INFO[gObj.userData.kind];
    heroKicker.textContent = 'קישוט במגש'; heroName.textContent = name; heroText.textContent = desc;
    chipsEl.hidden = true; btnExplode.hidden = true; btnPrev.setAttribute('aria-label', 'הקישוט הקודם'); btnNext.setAttribute('aria-label', 'הקישוט הבא');
    sub.textContent = 'גררו כדי להסתכל מכל הצדדים'; return;
  }
  const h = hero; if(!h) return; const R = ROLLS[h.id];
  chipsEl.hidden = false; btnExplode.hidden = false;
  if(rebuildChips){ chipsEl.replaceChildren(...h.layers.map((Lr, i)=>{ const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = Lr.name; b.addEventListener('click', ()=> isolate(hero && hero.iso === i ? -1 : i)); return b; })); }
  [...chipsEl.children].forEach((b, i)=> b.setAttribute('aria-pressed', h.iso === i));
  if(h.iso >= 0){ const Lr = h.layers[h.iso];
    heroKicker.textContent = R.he; heroName.textContent = Lr.name; heroText.textContent = Lr.desc;
    btnExplode.textContent = 'כל המרכיבים'; btnPrev.setAttribute('aria-label', 'המרכיב הקודם'); btnNext.setAttribute('aria-label', 'המרכיב הבא');
    sub.textContent = 'לחצו על מקום ריק כדי לחזור לכל המרכיבים';
  } else {
    heroKicker.textContent = exploded ? 'מפורק למרכיבים' : 'רול מהמגש'; heroName.textContent = R.he;
    heroText.textContent = exploded ? 'לחצו על מרכיב, על התווית שלו או על הכפתור שלו כדי לראות אותו מקרוב.' : rollBlurb(R);
    btnExplode.textContent = exploded ? 'הרכיבו חזרה' : 'פרקו למרכיבים'; btnPrev.setAttribute('aria-label', 'הרול הקודם'); btnNext.setAttribute('aria-label', 'הרול הבא');
    sub.textContent = exploded ? 'לחצו על מרכיב כדי לראות אותו מקרוב' : 'לחצו על הרול כדי לפרק אותו';
  }
}
function focusPiece(pi){
  if(!ready) return;
  if(hero && hero.pi === pi) return;
  if(hero){ hero.kT = 0; hero.iso = -1; leaving.push(hero); hero = null; }
  setMode('focus');
  const back = leaving.find(h => h.pi === pi && h.tray === current && !h.swapOut);
  if(back){ leaving.splice(leaving.indexOf(back), 1); hero = back; hero.kT = 1; }
  else {
    const p = pieces[pi]; p.hidden = true; p.lift.x = p.lift.v = 0; writePiece(pi);
    hero = buildHero(pi); scene.add(hero.root);
  }
  exploded = false; hero.iso = -1; dimT = 1;
  makeLabels(hero); fillSheet(true); sheet.classList.add('open');
  frameHero(true); bokeh.enabled = quality < 2; needs();
}
function toggleExplode(){ if(!hero) return; exploded = !exploded; if(!exploded) hero.iso = -1; fillSheet(); frameHero(); needs(); }
function isolate(i){ if(!hero) return; if(i >= 0) exploded = true; hero.iso = i; fillSheet(); frameHero(); needs(); }
function backToTray(){
  if(mode === 'tray') return;
  if(hero){ hero.kT = 0; hero.iso = -1; leaving.push(hero); hero = null; }
  exploded = false; gObj = null; dimT = 0; setMode('tray'); sheet.classList.remove('open');
  sub.textContent = trayLabel(); bokeh.enabled = false; makeLabels(null); frameTray(); needs();
}
// step to the next roll type without going back to the tray: the held piece shrinks away and the next one pops in
function swapRoll(dir){
  if(!hero) return;
  const ids = [...new Set(pieces.map(p => p.id))], nid = ids[(ids.indexOf(hero.id) + dir + ids.length) % ids.length];
  const npi = pieces.findIndex(p => p.id === nid && !p.hidden); if(npi < 0) return;
  const old = hero; old.popT = 0; old.swapOut = true; leaving.push(old);
  const p = pieces[npi]; p.hidden = true; writePiece(npi);
  hero = buildHero(npi); hero.k = S(1); hero.pop = S(0); scene.add(hero.root);
  hero.iso = -1; makeLabels(hero); fillSheet(true); frameHero(); needs();
}
function focusGarnish(top){
  if(!ready) return;
  gObj = top; setMode('garnish'); dimT = .35; fillSheet(); sheet.classList.add('open');
  const bx = new THREE.Box3().setFromObject(top); bx.expandByScalar(Math.max(0, 2.2 - bx.getSize(v3).length()/2));
  frame(boxPoints(bx), camDir(), 1.25); needs();
}
function step(dir){
  if(mode === 'garnish'){ const list = garnish.children, i = list.indexOf(gObj); focusGarnish(list[(i + dir + list.length) % list.length]); }
  else if(hero && hero.iso >= 0){ const n = hero.layers.length; isolate((hero.iso + dir + n) % n); }
  else swapRoll(dir);
}
btnExplode.addEventListener('click', ()=>{ if(hero && hero.iso >= 0) isolate(-1); else toggleExplode(); });
btnBack.addEventListener('click', backToTray);
btnPrev.addEventListener('click', ()=> step(-1)); btnNext.addEventListener('click', ()=> step(1));
document.getElementById('trays').addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b || mode !== 'tray') return;
  document.querySelectorAll('#trays button').forEach(x=>x.setAttribute('aria-pressed', x===b)); build(b.dataset.t); lastInput = performance.now(); frameTray(); });
document.getElementById('views').addEventListener('click', e=>{ const b = e.target.closest('button'); if(!b || mode !== 'tray') return;
  view = b.dataset.v; document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed', x===b)); lastInput = performance.now(); frameTray(); });

// ---------- ingredient labels with gold pointer lines (as in the Red Dragon and nigiri models) ----------
const overlay = document.getElementById('overlay'), svg = document.getElementById('lines'), tip = document.getElementById('tip');
let LBL = [];
function makeLabels(h){
  for(const x of LBL){ x.el.remove(); x.line.remove(); }
  LBL = h ? h.layers.map((Lr, i)=>{
    const el = document.createElement('div'); el.className = 'lbl'; el.dir = 'rtl'; el.lang = 'he'; el.textContent = Lr.name;
    const s = document.createElement('small'); s.textContent = Lr.sub; el.appendChild(s);
    el.addEventListener('click', ()=> isolate(hero && hero.iso === i ? -1 : i)); overlay.appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); line.setAttribute('stroke', 'rgba(207,166,90,.6)'); line.setAttribute('stroke-width', '1'); line.setAttribute('opacity', '0'); svg.appendChild(line);
    return {el, line, w:0, h:0};
  }) : [];
}
function updateLabels(){
  const h = hero, show = h && mode === 'focus' && h.ex.x > .75 && h.k.x > .95 && h.pop.x > .9;
  if(!show){ for(const x of LBL){ x.el.classList.remove('on'); x.line.setAttribute('opacity', '0'); } return; }
  const {top, bottom} = band(), W = innerWidth, items = []; let cx = 0, cy = 0;
  h.layers.forEach((Lr, i)=>{ const v = Lr.g.localToWorld(v3.copy(Lr.c)).project(camera); const it = {i, ax:(v.x*.5+.5)*W, ay:(-v.y*.5+.5)*innerHeight, vis:v.z < 1 && (h.iso < 0 || h.iso === i)}; cx += it.ax; cy += it.ay; items.push(it); });
  cx /= items.length; cy /= items.length;
  for(const it of items){ const x = LBL[it.i]; if(!x.w){ x.w = x.el.offsetWidth; x.h = x.el.offsetHeight; }
    let dx = it.ax - cx, dy = it.ay - cy; const d = Math.hypot(dx, dy); if(d < 1){ dx = 0; dy = -1; } else { dx /= d; dy /= d; }
    const reach = h.iso >= 0 ? 120 : 66; it.x = it.ax + dx*reach; it.y = it.ay + dy*reach; it.w = x.w; it.h = x.h; }
  const vis = items.filter(it => it.vis);
  for(let k=0;k<10;k++) for(let a=0;a<vis.length;a++) for(let b=a+1;b<vis.length;b++){ const A = vis[a], B = vis[b];
    const ox = (A.w + B.w)/2 + 8 - Math.abs(A.x - B.x), oy = (A.h + B.h)/2 + 6 - Math.abs(A.y - B.y);
    if(ox > 0 && oy > 0){ if(oy < ox){ const s = A.y <= B.y ? -1 : 1; A.y += s*oy/2; B.y -= s*oy/2; } else { const s = A.x <= B.x ? -1 : 1; A.x += s*ox/2; B.x -= s*ox/2; } } }
  for(const it of items){ const x = LBL[it.i];
    it.x = clamp(it.x, it.w/2 + 8, W - it.w/2 - 8); it.y = clamp(it.y, top + it.h/2 + 4, bottom - it.h/2 - 8);
    x.el.style.left = it.x + 'px'; x.el.style.top = it.y + 'px'; x.el.classList.toggle('on', it.vis); x.el.classList.toggle('sel', h.iso === it.i);
    x.line.setAttribute('x1', it.ax); x.line.setAttribute('y1', it.ay); x.line.setAttribute('x2', it.x); x.line.setAttribute('y2', it.y); x.line.setAttribute('opacity', it.vis ? '1' : '0'); }
}

// ---------- hover (mouse): the roll under the pointer lifts a little and names itself ----------
let hoverPi = -1, hoverEv = null; const lifted = new Set();
function setHover(pi, ev){
  if(pi !== hoverPi){ hoverPi = pi; if(pi >= 0) lifted.add(pi); document.body.classList.toggle('hover', pi >= 0); needs(); }
  if(pi >= 0 && ev){ const R = ROLLS[pieces[pi].id]; tip.replaceChildren(R.he, Object.assign(document.createElement('small'), {textContent:'לחצו כדי לפתוח'})); tip.style.left = ev.clientX + 'px'; tip.style.top = (ev.clientY - 34) + 'px'; tip.classList.add('on'); }
  else if(pi < 0) tip.classList.remove('on');
}

// ---------- tap vs drag, double-tap to zoom ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), canvas = renderer.domElement;
let down = null, lastTap = null, lastInput = performance.now();
function pick(e, list, recursive=false){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(list, recursive)[0]; }
canvas.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY, t:performance.now()}; lastInput = performance.now(); });
canvas.addEventListener('pointerup', e=>{
  if(!down) return; const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y), dt = performance.now()-down.t; down = null;
  if(moved > 8 || dt > 450 || !ready) return;
  if(mode === 'tray'){
    const hit = pick(e, [...pickables, ...garnPick]);
    if(hit && hit.object.userData.garn) return focusGarnish(hit.object.userData.garn);
    if(hit && hit.instanceId != null) return focusPiece(hit.object.userData.idxs[hit.instanceId]);
    const now = performance.now();
    if(lastTap && now - lastTap.t < 360 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30){ lastTap = null; zoomAt(e); }
    else lastTap = {t:now, x:e.clientX, y:e.clientY};
  } else if(mode === 'focus' && hero){
    ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(hero.spin, true).find(x => x.object.visible);
    if(!hit){ if(hero.iso >= 0) isolate(-1); return; }
    let o = hit.object; while(o && !o.userData.layer) o = o.parent;
    if(!exploded || !o) return toggleExplode();
    const i = hero.layers.indexOf(o.userData.layer); isolate(hero.iso === i ? -1 : i);
  }
});
function zoomAt(e){
  if(cc.distance < 40) return frameTray();
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3(); if(!ray.ray.intersectPlane(new THREE.Plane(UP, -2), p)) return;
  cc.moveTo(p.x, p.y, p.z, true); cc.dollyTo(cc.distance*.5, true);
}
canvas.addEventListener('pointermove', e=>{ if(e.pointerType === 'mouse' && !down) hoverEv = e; });
canvas.addEventListener('pointerleave', ()=>{ hoverEv = null; setHover(-1); });
canvas.addEventListener('wheel', ()=>{ lastInput = performance.now(); }, {passive:true});
cc.addEventListener('controlstart', ()=>{ lastInput = performance.now(); });
addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ if(hero && hero.iso >= 0) isolate(-1); else if(hero && exploded) toggleExplode(); else backToTray(); }
  if(mode !== 'tray' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest('input')) step(e.key === 'ArrowLeft' ? 1 : -1);
});

// ---------- post: ambient occlusion in the contact points, a soft depth of field on close-ups ----------
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, {type:THREE.HalfFloatType, samples:4}));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({radius:1.1, distanceExponent:1.6, thickness:1.2, scale:1.15, samples:12, distanceFallOff:1});
gtao.updatePdMaterial({lumaPhi:10, depthPhi:2, normalPhi:3, radius:5, rings:2, samples:12});
gtao.blendIntensity = .9;
composer.addPass(gtao);
const bokeh = new BokehPass(scene, camera, {focus:20, aperture:.00045, maxblur:.006}); bokeh.enabled = false;
composer.addPass(bokeh);
composer.addPass(new OutputPass());
let quality = lockQ != null ? +lockQ : coarse ? 1 : 0;
function applyQuality(){
  const dpr = Math.min(devicePixelRatio, [2, 1.5, 1][quality]);
  renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr); gtao.enabled = quality < 2; if(quality >= 2) bokeh.enabled = false; resize();
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); for(const x of LBL) x.w = 0; needs(); }
addEventListener('resize', ()=>{ resize(); if(mode === 'focus') frameHero(); else if(mode === 'tray') frameTray(); });
applyQuality();
let lastFrame = 0, frameTimes = [];
function watchFrameRate(now){ // step the sharpness and effects down if this device can't hold a smooth frame rate
  if(lockQ == null && lastFrame && now - lastFrame < 250){ frameTimes.push(now - lastFrame);
    if(frameTimes.length >= 40){ const avg = frameTimes.reduce((a,b)=>a+b)/frameTimes.length; frameTimes = []; if(avg > 26 && quality < 2){ quality++; applyQuality(); } } }
  lastFrame = now;
}

// ---------- save a frame (for ads and the Higgsfield upgrade) ----------
let downloads = null;
(async()=>{ try{ downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ downloads = null; }
  if(!downloads) document.getElementById('btnShot').hidden = true; })();
document.getElementById('btnShot').addEventListener('click', ()=>{
  const note = document.getElementById('shotNote');
  renderer.shadowMap.needsUpdate = true; composer.render();
  renderer.domElement.toBlob(async blob=>{
    try{ await downloads.save({filename:`yoko-${current}-${view}.png`, data:blob}); note.textContent = 'נשמר'; }
    catch(e){ note.textContent = e && e.code==='declined' ? 'בוטל' : 'השמירה לא זמינה כאן'; }
    setTimeout(()=>note.textContent='', 2500);
  }, 'image/png');
});

// ---------- the loop: springs, camera, and a render only when something changed ----------
const clock = new THREE.Clock();
function stepWorld(dt){
  let act = false;
  if(drop.t < 1){ // pieces drop into the tray one after another
    drop.t = Math.min(1, drop.t + dt/1.3); const N = pieces.length;
    pieces.forEach((p, i)=>{ const u = clamp((drop.t - .45*i/N)/.55, 0, 1); p.dy = 7*(1 - easeOut(u)); writePiece(i); });
    garnish.position.y = 7*(1 - easeOut(clamp((drop.t - .35)/.65, 0, 1)));
    shadowDirty = true; act = true;
  }
  if(hoverEv && mode === 'tray' && ready){ const hit = pick(hoverEv, pickables); setHover(hit && hit.instanceId != null ? hit.object.userData.idxs[hit.instanceId] : -1, hoverEv); hoverEv = null; }
  for(const pi of lifted){ const p = pieces[pi]; if(!p){ lifted.delete(pi); continue; }
    const t = pi === hoverPi && mode === 'tray' ? .5*p.sc : 0;
    if(spring(p.lift, t, dt, 14)) act = true; else if(!t) lifted.delete(pi);
    writePiece(pi); shadowDirty = true; }
  if(spring(dimS, dimT, dt, 6)){ setDim(dimS.x); act = true; }
  if(hero && updateHero(hero, dt)) act = true;
  for(const h of [...leaving]){ updateHero(h, dt); act = true; if(h.swapOut ? h.pop.x < .02 : (h.k.x < .004 && Math.abs(h.k.v) < .05)) disposeHero(h); }
  return act;
}
renderer.setAnimationLoop(now=>{
  const dt = Math.min(clock.getDelta(), lockQ != null ? .5 : 1/20);
  let act = false;
  if(ready && mode === 'tray' && view !== 'top' && !reduce && now - lastInput > 6000){ cc.rotate(dt*.09, 0, false); act = true; }
  act = cc.update(dt) || act;
  act = stepWorld(dt) || act;
  if(act) needs();
  if(dirty <= 0){ lastFrame = 0; return; }
  dirty--;
  if(bokeh.enabled) bokeh.uniforms.focus.value = camera.position.distanceTo(cc.getTarget(v3));
  if(shadowDirty){ renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  renderer.info.reset(); composer.render(dt);
  updateLabels();
  watchFrameRate(now);
});

// ---------- loading: textures and meshes first, then compile every shader so the first tap is smooth ----------
const loadBar = document.getElementById('loadBar'), loading = document.getElementById('loading');
manager.onProgress = (u, a, b)=>{ loadBar.style.width = Math.round(a/b*100) + '%'; };
manager.onLoad = ()=> finishLoading();
setTimeout(()=> finishLoading(), 20000);
async function finishLoading(){
  if(ready) return; ready = true;
  const tmp = new THREE.Group(), box = new THREE.BoxGeometry(.01, .01, .01);
  for(const k in MAT){ const m = MAT[k].clone(); m.transparent = true; tmp.add(new THREE.Mesh(box, m)); }
  for(const geo of [GRAIN, CRUMB]){ const im = new THREE.InstancedMesh(geo, MAT.grain.clone(), 1); im.material.transparent = true; im.setColorAt(0, new THREE.Color()); tmp.add(im); }
  tmp.position.copy(HERO_POS); scene.add(tmp);
  try{ await renderer.compileAsync(scene, camera); }catch(e){}
  const be = bokeh.enabled; bokeh.enabled = quality < 2; renderer.shadowMap.needsUpdate = true; composer.render(); bokeh.enabled = be;
  scene.remove(tmp); tmp.traverse(o=>{ if(o.material) o.material.dispose(); });
  loading.classList.add('done'); setTimeout(()=> loading.remove(), 800);
  drop.t = reduce ? 1 : 0; frameTray(); needs();
  window.__ready = true;
  prefetchFills();
}
// the 2k filling photos: decoded off the main thread one by one, then handed to the GPU
async function prefetchFills(){
  for(const [t, f] of LAZY){
    try{ const img = new Image(); img.src = f; await img.decode(); t.dispose(); t.image = img; t.needsUpdate = true; renderer.initTexture(t); needs(); }catch(e){}
    await new Promise(r => setTimeout(r, 40));
  }
  window.__fills = true;
}

build('party');
{ const p = VIEWS.angle().multiplyScalar(1.35); cc.setLookAt(p.x*.6, p.y*1.1, p.z*1.2, TRAY_TARGET.x, TRAY_TARGET.y, TRAY_TARGET.z, false); }
// test hooks for the render harness
window.__yoko = {info:()=>({calls:renderer.info.render.calls, triangles:renderer.info.render.triangles, quality}), focusPiece, toggleExplode, isolate, backToTray, swapRoll, focusGarnish, garnish, get pieces(){ return pieces; }, get hero(){ return hero; }, cc, setQuality(q){ quality = q; applyQuality(); }};
</script>
