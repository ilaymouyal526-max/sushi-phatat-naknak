<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoko Ono — Le Grand Jeu · Règles</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="noir-elegant.css">
<style>
  .kicker { margin-top: 30px; }
  h1 { margin-top: 10px; font-size: 84px; }
  .title-alt { margin-top: 10px; }
  .title-alt .en { font-size: 44px; }
  .title-alt .he { font-size: 40px; }

  .table { width: 100%; margin-top: 30px; }
  .row { display: grid; grid-template-columns: 40px 1.15fr 1.08fr .86fr; column-gap: 24px; padding: 13px 0 14px; border-top: 1px solid var(--line); }
  .row.head { border-top: 0; padding: 0 0 10px; }
  .row.head span { font-weight: 700; font-size: 20px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  .row.head span[lang="he"] { font-size: 22px; font-weight: 500; letter-spacing: 0; text-align: right; }
  .num { font-style: italic; font-weight: 700; font-size: 46px; line-height: .85; color: var(--gold); }
  .cell h3 { font-weight: 700; font-size: 21px; line-height: 1.15; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-light); }
  .cell p { margin-top: 6px; font-weight: 500; font-size: 23px; line-height: 1.25; color: var(--ivory-dim); }
  .cell[lang="he"] { text-align: right; }
  .cell[lang="he"] h3 { font-size: 23px; letter-spacing: 0; }
  .cell[lang="he"] p { font-weight: 400; font-size: 21px; line-height: 1.4; }
  .row.note .cell h3 { color: var(--gold); }
  .row.note .icon { width: 36px; height: 36px; color: var(--gold); margin-top: 2px; }

  .prize-strip { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .strip { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 18px; border: 1.5px solid var(--gold); }
  .strip .dice-row svg { width: 24px; height: 24px; display: block; }
  .strip .dice-row .pair { display: flex; gap: 3px; }
  .strip .dice-row { display: flex; gap: 12px; }
  .strip .big { font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: lining-nums; color: var(--gold-light); }
  .strip.free { background: linear-gradient(160deg, #d9b67c 0%, var(--gold) 55%, #b48c55 100%); border-color: var(--gold-light); }
  .strip.free .big { color: #14110e; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="frame"></div>

  <div class="content">
    <header class="logo">
      <div class="name">YOKO ONO</div>
      <div class="sub">ASIAN KITCHEN</div>
    </header>

    <div class="kicker"><i></i><span class="fr" data-t="kicker.fr"></span><b class="diamond"></b><span class="en" data-t="kicker.en"></span><b class="diamond"></b><span class="he" data-t="kicker.he"></span><i></i></div>
    <h1 data-t="rulesTitle.fr"></h1>
    <div class="title-alt"><span class="en" data-t="rulesTitle.en"></span><b class="diamond"></b><span class="he" data-t="rulesTitle.he"></span></div>

    <section class="table" id="table">
      <div class="row head"><span></span><span>Français</span><span>English</span><span lang="he" dir="rtl">עברית</span></div>
    </section>

    <section class="prize-strip">
      <div class="strip half"><div class="dice-row" data-dice="1,2,3"></div><div class="big">−50%</div></div>
      <div class="strip free"><div class="dice-row" data-dice="4,5,6"></div><div class="big">100%</div></div>
    </section>
  </div>

  <div class="signoff"><span class="seal">運</span><span>YOKO ONO · ASIAN KITCHEN</span></div>
</div>

<script src="../../shared/dice.js"></script>
<script src="copy.js"></script>
<script>
(() => {
  const table = document.getElementById("table");
  const ICONS = [
    '<svg class="icon" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="17" cy="17" r="15.5"/><path d="M11 21c1.5 2.3 3.6 3.4 6 3.4s4.5-1.1 6-3.4M12 13.5h.01M22 13.5h.01" stroke-linecap="round" stroke-width="2"/></svg>',
    '<svg class="icon" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="10" width="21" height="15" rx="2"/><path d="M23 15.5l9-5v14l-9-5z" stroke-linejoin="round"/><circle cx="7.5" cy="14.5" r="1.4" fill="currentColor" stroke="none"/></svg>',
  ];
  const row = (lead, path, cls = "") => {
    const r = document.createElement("div");
    r.className = "row " + cls;
    r.innerHTML = `<div>${lead}</div>` + ["fr", "en", "he"].map(l =>
      `<div class="cell" lang="${l}"><h3 data-t="${path}.${l}.t"></h3><p data-t="${path}.${l}.d"></p></div>`).join("");
    table.appendChild(r);
  };
  COPY.rules.forEach((_, i) => row(`<div class="num">0${i + 1}</div>`, `rules.${i}`));
  COPY.notes.forEach((_, i) => row(ICONS[i], `notes.${i}`, "note"));
  fillCopy();
  for (const c of document.querySelectorAll('.cell[lang="he"]')) c.dir = "rtl";

  Dice.fillDoubles(document.querySelector(".strip.half"), {});
  Dice.fillDoubles(document.querySelector(".strip.free"), { body: "#14110e", pip: "#f4ecdf" });
})();
</script>
</body>
</html>
