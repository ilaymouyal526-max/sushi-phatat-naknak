<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoko Ono — Le Grand Jeu · Showa Pop</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  :root {
    --cream: #f3e6c8;
    --cream-2: #fff6df;
    --navy: #1d2a4a;
    --tomato: #e0452b;
    --teal: #1f8a84;
    --mustard: #e8b23a;
  }
  @page { size: 297mm 420mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2b2b2b; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media print { html, body { background: var(--cream); } }

  .poster {
    position: relative; width: 297mm; height: 420mm; margin: 0 auto; overflow: hidden;
    background: var(--cream); color: var(--navy); font-family: "Rubik", sans-serif;
  }
  .halftone { position: absolute; inset: 0; width: 100%; height: 100%; }
  .border { position: absolute; inset: 20px; border: 7px solid var(--navy); border-radius: 22px; }
  .border::after { content: ""; position: absolute; inset: 6px; border: 2px solid var(--tomato); border-radius: 14px; }

  .content { position: absolute; inset: 0; padding: 52px 58px 48px; display: flex; flex-direction: column; align-items: center; }
  .content > * { flex-shrink: 0; }

  .logo { display: flex; align-items: center; gap: 18px; }
  .logo .name { font-weight: 900; font-size: 50px; letter-spacing: .04em; color: var(--navy); text-shadow: 3px 3px 0 var(--tomato); }
  .logo .sub { background: var(--teal); color: var(--cream-2); font-weight: 700; font-size: 14px; letter-spacing: .32em; padding: 8px 12px 8px 16px; border-radius: 99px; }

  .hero { position: relative; width: 1007px; height: 386px; margin-top: 4px; }
  .hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .burst { position: absolute; right: 56px; top: 0; width: 170px; height: 170px; transform: rotate(12deg); }
  .burst svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .burst div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--cream-2); line-height: 1.05; }
  .burst .fr { display: block; font-weight: 900; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  .burst .en { display: block; font-weight: 800; font-style: italic; font-size: 17px; text-transform: uppercase; color: var(--mustard); }
  .burst .he { display: block; font-weight: 900; font-size: 20px; }

  h1 { margin-top: 0; white-space: nowrap; font-weight: 900; font-size: 100px; line-height: .92; text-transform: uppercase; color: var(--tomato); text-shadow: 6px 6px 0 var(--navy); transform: rotate(-2.5deg); letter-spacing: -.01em; }
  h1::after { content: " !"; }
  .title-alt { margin-top: 10px; display: flex; align-items: center; gap: 16px; }
  .title-alt .en { font-weight: 800; font-style: italic; font-size: 38px; text-transform: uppercase; color: var(--navy); }
  .title-alt .he { font-weight: 800; font-size: 38px; color: var(--teal); }
  .star { width: 22px; height: 22px; flex: none; }

  .coupons { margin-top: 22px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .coupon {
    position: relative; display: grid; grid-template-columns: 98px 1fr; border-radius: 16px; color: var(--cream-2);
    -webkit-mask: radial-gradient(circle 15px at 98px 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 15px at 98px 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
            mask: radial-gradient(circle 15px at 98px 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 15px at 98px 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
  }
  .coupon.half { background: var(--teal); }
  .coupon.free { background: var(--tomato); }
  .stub { border-right: 3px dashed rgba(255,246,223,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 0; }
  .stub .pair { display: flex; gap: 3px; }
  .stub svg { width: 24px; height: 24px; display: block; }
  .stub .label { font-weight: 900; font-size: 13px; letter-spacing: .14em; writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; margin-top: 4px; }
  .main { padding: 18px 18px 18px; text-align: center; }
  .main .tag { display: inline-flex; gap: 10px; align-items: center; background: var(--navy); color: var(--mustard); font-weight: 900; font-size: 15px; letter-spacing: .14em; padding: 5px 14px; border-radius: 99px; text-transform: uppercase; }
  .main .tag .he { letter-spacing: 0; font-size: 16px; }
  .main .big { font-weight: 900; font-size: 100px; line-height: .9; margin-top: 8px; color: var(--mustard); text-shadow: 5px 5px 0 var(--navy); letter-spacing: -.02em; }
  .coupon.free .main .big { color: var(--cream-2); }
  .main .big small { font-size: .55em; }
  .main .lines { margin-top: 12px; display: grid; gap: 2px; }
  .main .lines .fr { font-weight: 700; font-size: 17px; }
  .main .lines .en { font-weight: 500; font-style: italic; font-size: 16px; opacity: .9; }
  .main .lines .he { font-weight: 700; font-size: 18px; }

  .section-head { margin-top: 22px; display: flex; align-items: center; gap: 14px; background: var(--navy); color: var(--cream-2); padding: 9px 24px; border-radius: 99px; }
  .section-head .fr { font-weight: 900; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; }
  .section-head .en { font-weight: 600; font-style: italic; font-size: 18px; color: var(--mustard); }
  .section-head .he { font-weight: 800; font-size: 19px; color: var(--mustard); }
  .section-head .star { width: 14px; height: 14px; }

  .rules { margin-top: 20px; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 20px; }
  .rule { text-align: center; }
  .pict { position: relative; width: 92px; height: 92px; margin: 0 auto; }
  .pict svg { width: 100%; height: 100%; display: block; }
  .pict .n { position: absolute; right: -6px; top: -4px; width: 32px; height: 32px; border-radius: 50%; background: var(--tomato); color: var(--cream-2); font-weight: 900; font-size: 17px; display: grid; place-items: center; border: 3px solid var(--navy); }
  .rule h3 { margin-top: 12px; font-weight: 900; font-size: 15.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tomato); }
  .rule p { font-size: 14px; line-height: 1.36; margin-top: 4px; }
  .rule p.en { font-style: italic; color: #3c4766; margin-top: 8px; }
  .rule p.he { font-size: 15px; margin-top: 8px; }
  .rule p strong { font-weight: 800; }
  .rule p.en strong, .rule p.he strong { color: var(--teal); }
  .rule b { font-weight: 800; }

  .notes { margin-top: auto; width: 100%; background: var(--navy); color: var(--cream-2); border-radius: 18px; padding: 18px 26px 16px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; }
  .note { display: grid; grid-template-columns: 38px 1fr; column-gap: 12px; }
  .note .icon { width: 36px; height: 36px; color: var(--mustard); }
  .note h4 { font-weight: 900; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mustard); }
  .note h4 span[lang="he"] { letter-spacing: 0; font-size: 13.5px; }
  .note p { font-size: 11.5px; line-height: 1.38; margin-top: 3px; }
  .note p.en { font-style: italic; opacity: .85; }
  .note p.he { font-size: 12.5px; }
  .note .he-wrap { text-align: right; }

  .signoff { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--cream); padding: 0 14px; white-space: nowrap; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 12px; letter-spacing: .4em; color: var(--navy); }
  .seal { width: 24px; height: 24px; background: var(--tomato); color: var(--cream-2); display: grid; place-items: center; font-family: "Shippori"; font-size: 16px; letter-spacing: 0; border-radius: 4px; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <svg class="halftone" aria-hidden="true">
    <defs>
      <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="2.4" fill="#e0452b"/></pattern>
      <radialGradient id="corners" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></radialGradient>
      <mask id="cornerMask"><rect width="100%" height="100%" fill="url(#corners)"/></mask>
    </defs>
    <rect width="100%" height="100%" fill="url(#dots)" opacity=".28" mask="url(#cornerMask)"/>
  </svg>
  <div class="border"></div>

  <div class="content">
    <header class="logo"><div class="name">YOKO ONO</div><div class="sub">ASIAN KITCHEN</div></header>

    <section class="hero">
      <svg id="hero" viewBox="0 0 1007 392" aria-label="Deux dés qui rebondissent"></svg>
      <div class="burst">
        <svg viewBox="-50 -50 100 100" id="burst"></svg>
        <div><div><span class="fr" data-t="new.fr"></span><span class="en" data-t="new.en"></span><span class="he" data-t="new.he"></span></div></div>
      </div>
    </section>

    <h1 data-t="title.fr"></h1>
    <div class="title-alt"><span class="en" data-t="title.en"></span><svg class="star" viewBox="-10 -10 20 20"><path d="M0-10 2.4-2.4 10 0 2.4 2.4 0 10-2.4 2.4-10 0-2.4-2.4Z" fill="#e8b23a" stroke="#1d2a4a" stroke-width="1.4"/></svg><span class="he" data-t="title.he"></span></div>

    <section class="coupons">
      <div class="coupon half">
        <div class="stub"><div data-dice="1,2,3" class="dice-col"></div><div class="label" data-t="half.label.fr"></div></div>
        <div class="main">
          <div class="tag"><span>Double</span><span class="he">דאבל</span></div>
          <div class="big">−50<small>%</small></div>
          <div class="lines"><span class="fr" data-t="half.fr"></span><span class="en" data-t="half.en"></span><span class="he" data-t="half.he"></span></div>
        </div>
      </div>
      <div class="coupon free">
        <div class="stub"><div data-dice="4,5,6" class="dice-col"></div><div class="label" data-t="free.label.fr"></div></div>
        <div class="main">
          <div class="tag"><span data-t="free.ribbon.fr"></span><span class="he" data-t="free.ribbon.he"></span></div>
          <div class="big">100<small>%</small></div>
          <div class="lines"><span class="fr" data-t="free.fr"></span><span class="en" data-t="free.en"></span><span class="he" data-t="free.he"></span></div>
        </div>
      </div>
    </section>

    <div class="section-head"><span class="fr" data-t="rulesTitle.fr"></span><svg class="star" viewBox="-10 -10 20 20"><path d="M0-10 2.4-2.4 10 0 2.4 2.4 0 10-2.4 2.4-10 0-2.4-2.4Z" fill="#e8b23a"/></svg><span class="en" data-t="rulesTitle.en"></span><svg class="star" viewBox="-10 -10 20 20"><path d="M0-10 2.4-2.4 10 0 2.4 2.4 0 10-2.4 2.4-10 0-2.4-2.4Z" fill="#e8b23a"/></svg><span class="he" data-t="rulesTitle.he"></span></div>
    <section class="rules" id="rules"></section>

    <section class="notes" id="notes"></section>
  </div>

  <div class="signoff"><span class="seal">運</span><span>YOKO ONO · ASIAN KITCHEN</span></div>
</div>

<script src="../../shared/dice.js"></script>
<script src="copy.js"></script>
<script>
(() => {
  const { el, isoDie } = window.Dice;
  const NAVY = "#1d2a4a", TOMATO = "#e0452b", TEAL = "#1f8a84", MUSTARD = "#e8b23a", CREAM = "#fff6df";

  // Pictograms for the four rules, drawn on a mustard disc
  const disc = `<circle cx="42" cy="42" r="39" fill="${MUSTARD}" stroke="${NAVY}" stroke-width="4"/>`;
  const s = `fill="none" stroke="${NAVY}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"`;
  const PICTS = [
    // the bill
    `${disc}<path ${s} d="M28 20h28v42l-4.7-3.5-4.6 3.5-4.7-3.5-4.7 3.5-4.6-3.5L28 62Z" fill="${CREAM}"/><path ${s} d="M34 31h16M34 39h16M34 47h10"/>`,
    // one attempt: a die and ×1
    `${disc}<rect x="20" y="25" width="30" height="30" rx="6" fill="${CREAM}" stroke="${NAVY}" stroke-width="3.6"/><circle cx="35" cy="40" r="4.5" fill="${TOMATO}"/><text x="60" y="50" text-anchor="middle" font-family="Rubik" font-weight="900" font-size="20" fill="${NAVY}">×1</text>`,
    // one person
    `${disc}<circle cx="42" cy="30" r="9" fill="${CREAM}" stroke="${NAVY}" stroke-width="3.6"/><path ${s} fill="${CREAM}" d="M25 62c0-11 7.6-17 17-17s17 6 17 17Z"/>`,
    // bounce off the wall
    `${disc}<path ${s} d="M60 18v48"/><path stroke="${NAVY}" stroke-width="2.4" d="M60 24l7-6M60 34l7-6M60 44l7-6M60 54l7-6M60 64l7-6"/><path ${s} stroke-dasharray="1 7" d="M18 56Q38 22 57 36"/><path ${s} d="M57 36Q46 44 40 58"/><path fill="${NAVY}" d="M40 60 48.1 51.6 38.9 47.7Z"/>`,
  ];
  document.getElementById("rules").innerHTML = COPY.rules.map((_, i) => `
    <div class="rule">
      <div class="pict"><svg viewBox="0 0 84 84">${PICTS[i]}</svg><div class="n">${i + 1}</div></div>
      <h3 data-t="rules.${i}.fr.t"></h3>
      <p class="fr" data-t="rules.${i}.fr.d"></p>
      <p class="en"><strong data-t="rules.${i}.en.t"></strong> · <span data-t="rules.${i}.en.d"></span></p>
      <p class="he"><strong data-t="rules.${i}.he.t"></strong> · <span data-t="rules.${i}.he.d"></span></p>
    </div>`).join("");

  const ICONS = [
    '<svg class="icon" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2"><circle cx="17" cy="17" r="15"/><path d="M11 21c1.5 2.3 3.6 3.4 6 3.4s4.5-1.1 6-3.4M12 13.5h.01M22 13.5h.01" stroke-linecap="round" stroke-width="2.6"/></svg>',
    '<svg class="icon" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="10" width="21" height="15" rx="2"/><path d="M23 15.5l9-5v14l-9-5z" stroke-linejoin="round"/><circle cx="7.5" cy="14.5" r="1.6" fill="currentColor" stroke="none"/></svg>',
  ];
  document.getElementById("notes").innerHTML = COPY.notes.map((_, i) => `
    <div class="note">${ICONS[i]}<div>
      <h4 data-t="notes.${i}.fr.t"></h4>
      <p class="fr" data-t="notes.${i}.fr.d"></p>
      <p class="en"><strong data-t="notes.${i}.en.t"></strong> <span data-t="notes.${i}.en.d"></span></p>
      <div class="he-wrap"><h4 data-t="notes.${i}.he.t"></h4><p class="he" data-t="notes.${i}.he.d"></p></div>
    </div></div>`).join("");
  fillCopy();
  for (const p of document.querySelectorAll("p.he")) { p.dir = "rtl"; p.lang = "he"; }

  Dice.fillDoubles(document.querySelector(".half"), { body: CREAM, pip: NAVY, red: TOMATO });
  Dice.fillDoubles(document.querySelector(".free"), { body: CREAM, pip: NAVY, red: TEAL });

  // New! starburst badge (16 points)
  const burst = document.getElementById("burst");
  const pts = [];
  for (let i = 0; i < 32; i++) {
    const r = i % 2 ? 41 : 49, a = (i / 32) * Math.PI * 2;
    pts.push(`${(r * Math.cos(a)).toFixed(2)},${(r * Math.sin(a)).toFixed(2)}`);
  }
  el("polygon", { points: pts.join(" "), fill: TOMATO, stroke: NAVY, "stroke-width": 2.5, "stroke-linejoin": "round" }, burst);
  el("circle", { r: 36, fill: "none", stroke: CREAM, "stroke-width": 1.2, "stroke-dasharray": "2 3" }, burst);

  // Hero: target rings, motion arcs, sparkles and two outlined dice
  const svg = document.getElementById("hero");
  const CX = 503, CY = 200;
  [[190, TEAL], [160, CREAM], [134, MUSTARD], [104, CREAM], [80, TOMATO]].forEach(([r, fill]) =>
    el("circle", { cx: CX, cy: CY, r, fill, stroke: NAVY, "stroke-width": 4 }, svg));

  const arc = { fill: "none", stroke: NAVY, "stroke-width": 5, "stroke-linecap": "round" };
  el("path", { ...arc, d: "M120 300 Q 210 150 330 140" }, svg);
  el("path", { ...arc, d: "M150 330 Q 240 200 340 196" }, svg);
  el("path", { ...arc, d: "M110 250 Q 170 160 250 140", "stroke-dasharray": "2 14" }, svg);
  el("path", { ...arc, d: "M700 110 Q 780 140 800 220", "stroke-dasharray": "2 14" }, svg);

  const sparkle = (x, y, r, fill) => el("path", {
    d: `M${x} ${y - r} L${x + r * .24} ${y - r * .24} L${x + r} ${y} L${x + r * .24} ${y + r * .24} L${x} ${y + r} L${x - r * .24} ${y + r * .24} L${x - r} ${y} L${x - r * .24} ${y - r * .24} Z`,
    fill, stroke: NAVY, "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
  sparkle(250, 60, 22, MUSTARD); sparkle(760, 300, 18, TEAL); sparkle(820, 190, 12, MUSTARD); sparkle(196, 205, 12, TOMATO); sparkle(300, 345, 10, TEAL);

  const theme = { top: CREAM, left: "#f4d58d", right: MUSTARD, edge: CREAM, pip: NAVY, red: TOMATO, stroke: NAVY, strokeWidth: 3 };
  isoDie(svg, { cx: 430, cy: 222, s: 104, rot: -14, top: 6, left: 4, right: 2, theme });
  isoDie(svg, { cx: 600, cy: 178, s: 92, rot: 16, top: 6, left: 3, right: 5, theme });
})();
</script>
</body>
</html>
