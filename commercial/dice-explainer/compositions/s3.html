    (() => {
      const tl = gsap.timeline({ paused: true });
      DiceKit.mount(["#s3-dA", "#s3-dB"]);
      const blurIn = (sel, t, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
      const words = (sel, t) => tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.085, ease: "power2.out" }, t);

      // Part A (beats 0-3): ink wipe in, then the sun sinks from 16h to 18h

      tl.fromTo("#s3-arc", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.2);
      tl.fromTo(["#s3-horizon", "#s3-mount"], { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.1 }, 0.35);
      tl.fromTo(["#s3-ticks", "#s3-labels"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.6);
      words("#s3-hh", 0.3);
      blurIn("#s3-hours", 0.55);
      blurIn("#s3-hours-alt", 0.8);
      tl.fromTo("#s3-sun-rig", { rotation: 30, svgOrigin: "540 1200" }, { rotation: 155, svgOrigin: "540 1200", duration: 1.5, ease: "power1.inOut" }, 0.9);
      tl.fromTo("#s3-sun", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(1.4)" }, 0.55);

      // Part B (beats 4-11): ink wipe to the table, the plates clear on the beat, the bill arrives on beat 10
      tl.fromTo("#s3-b", { "--wx": "-120px" }, { "--wx": "1200px", duration: 0.5, ease: "power2.inOut" }, 2.5);
      tl.fromTo("#s3-num", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, 2.8);

      blurIn("#s3-h-alt", 3.25);
      blurIn("#s3-d", 4.1);
      blurIn("#s3-d-alt", 4.3);

        tl.fromTo(sel, { x: 0, y: 0, opacity: 1 }, { x, y, opacity: 0, duration: 0.32, ease: "power3.in" }, 3.125 + i * 0.625 - 0.16));
      tl.fromTo("#s3-folder", { x: 900, y: 1300, rotation: 18 }, { x: 0, y: 0, rotation: -3, duration: 0.62, ease: "expo.out" }, 5.68);
