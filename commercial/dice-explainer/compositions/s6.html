    @font-face { font-family: "Frank Ruhl"; font-weight: 300 900; font-display: block; src: url('assets/fonts/frankruhl-normal-latin.woff2') format('woff2'); }

    #s6-all { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 30% at 50% 18%, #22150d 0%, #0b0907 75%); }
    /* The dice table, seen from the roller's end: a flat tray tilted away in perspective */
    #s6-plane { position: absolute; left: 40px; top: -530px; width: 1000px; height: 2600px; transform-origin: 50% 100%; transform: perspective(2500px) rotateX(30deg); transform-style: preserve-3d;
      background: linear-gradient(90deg, #6f4426 0%, #9a6539 18%, #7f4f2c 50%, #9a6539 82%, #6f4426 100%); border-radius: 26px; }
    #s6-wallband { position: absolute; inset: 44px; border-radius: 10px; background: #11512d; box-shadow: inset 0 0 40px rgba(0,0,0,.6); }
    #s6-felt { position: absolute; inset: 88px; border-radius: 6px; background: radial-gradient(ellipse 75% 45% at 50% 38%, #217d47 0%, #1a6b3c 45%, #0f4526 100%); }
    #s6-wallhi { position: absolute; left: 44px; right: 44px; top: 44px; height: 46px; background: #c9a36b; opacity: 0; }
    #s6-logo { position: absolute; left: 320px; top: 430px; width: 360px; height: 468px; }
    #s6-logo .ln { fill: none; stroke: #d6b26e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #s6-logo text { fill: #d6b26e; font-family: "Cormorant", serif; font-weight: 600; }
    #s6-paths { position: absolute; left: 0; top: 0; width: 1000px; height: 2600px; overflow: visible; }

    .s6-sh { position: absolute; left: -70px; top: -30px; width: 170px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55) 0%, rgba(120,8,22,.35) 42%, rgba(0,0,0,0) 70%); }
    #s6-num { position: absolute; left: 502px; top: 172px; width: 76px; height: 76px; border-radius: 50%; border: 2px solid #c9a36b; display: grid; place-items: center; font-family: "Cormorant", serif; font-weight: 700; font-size: 48px; color: #c9a36b; line-height: 1; }
    #s6-h { position: absolute; left: 80px; right: 80px; top: 268px; text-align: center; font-size: 66px; white-space: nowrap; }
    #s6-h-alt { position: absolute; left: 108px; right: 108px; top: 350px; text-align: center; font-size: 46px; }
    #s6-wl { position: absolute; left: 108px; right: 108px; top: 428px; text-align: center; font-family: "Cormorant", serif; font-weight: 700; font-size: 38px; letter-spacing: .26em; padding-left: .26em; color: #c9a36b; }
    #s6-wl-alt { position: absolute; left: 108px; right: 108px; top: 474px; text-align: center; font-size: 36px; }
    .s6-call { position: absolute; left: 108px; right: 108px; top: 1110px; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,.8); }
    .s6-call .fr { font-size: 64px; }
    .s6-call .alt { margin-top: 14px; font-size: 46px; }
    #s6-x .fr { color: #f4ecdf; }
    #s6-x .xmark { display: inline-block; width: 52px; height: 52px; margin-right: 18px; vertical-align: -4px; }
    #s6-again .fr { color: #e2c590; }
    #s6-ok { position: absolute; left: 470px; top: 1236px; width: 140px; height: 140px; }
  </style>
  <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
    <div id="s6-all" class="wipe">
      <div id="s6-plane" data-layout-allow-overflow>
        <div id="s6-wallband"></div>
        <div id="s6-felt"></div>
        <div id="s6-wallhi"></div>
        <svg id="s6-logo" viewBox="0 0 200 260">
          <path class="ln" d="M50 127 V68 A50 50 0 0 1 150 68 V127 M50 168 V192 A50 50 0 0 0 150 192 V168"/>
          <path class="ln" d="M54 50 Q74 60 92 70 M146 50 Q126 60 108 70"/>
          <g class="ln"><circle cx="64" cy="51" r="3.1"/><circle cx="68" cy="56" r="3.1"/><circle cx="61" cy="59" r="3.1"/><circle cx="80" cy="62" r="3.1"/><circle cx="83" cy="68" r="3.1"/><circle cx="74" cy="40" r="3.1"/><circle cx="136" cy="51" r="3.1"/><circle cx="132" cy="56" r="3.1"/><circle cx="139" cy="59" r="3.1"/><circle cx="120" cy="62" r="3.1"/><circle cx="117" cy="68" r="3.1"/><circle cx="126" cy="40" r="3.1"/></g>
          <polyline class="ln" points="62,124 86,90 99,106 113,80 138,124"/>
          <text x="100" y="151" text-anchor="middle" font-size="29" letter-spacing="2.6">YOKO ONO</text>
          <text x="100" y="163" text-anchor="middle" font-size="8.6" letter-spacing="1.9" font-weight="700">ASIAN KITCHEN</text>
          <path class="ln" d="M78 182 L122 182 Q120 204 100 204 Q80 204 78 182 Z M99 180 L112 157 M105 181 L119 161"/>
          <path class="ln" d="M70 230 Q100 208 130 230 M78 236 Q100 220 122 236 M86 240 Q100 230 114 240"/>
        </svg>
        <svg id="s6-paths" viewBox="0 0 1000 2600">
          <g id="s6-miss" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="430,2350 400,128 362,520" stroke="#f4ecdf" stroke-width="7" stroke-dasharray="2 22"/>
            <polyline points="590,2380 565,905 575,830" stroke="#f4ecdf" stroke-width="7" stroke-dasharray="2 22"/>
            <circle id="s6-ring" cx="575" cy="830" r="118" stroke="#b8322a" stroke-width="10" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>
          </g>
          <g fill="none" stroke="#e2c590" stroke-opacity=".8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <path id="s6-pa1" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" d="M430 2350 L380 128"/>
            <path id="s6-pa2" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" d="M380 128 L330 700"/>
            <path id="s6-pb1" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" d="M590 2380 L610 128"/>
            <path id="s6-pb2" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" d="M610 128 L680 820"/>
          </g>
        </svg>
        <div id="s6-shA" class="s6-sh"></div>
        <div id="s6-shB" class="s6-sh"></div>
        <div id="s6-dA" class="die s6-die" data-face="1"></div>
        <div id="s6-dB" class="die s6-die" data-face="6"></div>
      </div>
      <div id="s6-num">4</div>
      <div id="s6-h" class="fr"><span class="w">Le</span> <span class="w">lancer</span> <span class="w">parfait</span></div>
      <div id="s6-h-alt"><span class="en">The perfect roll</span><b class="dia"></b><span class="he" dir="rtl" lang="he">ההטלה המושלמת</span></div>
      <div id="s6-wl">PAROI D'EN FACE</div>
      <div id="s6-wl-alt"><span class="en">Opposite wall</span><b class="dia"></b><span class="he" dir="rtl" lang="he">הקיר שממול</span></div>
      <div id="s6-x" class="s6-call">
        <div class="fr"><svg class="xmark" viewBox="0 0 52 52"><path d="M10 10 L42 42 M42 10 L10 42" stroke="#b8322a" stroke-width="8" stroke-linecap="round"/></svg>Non validé</div>
        <div class="alt"><span class="en">Not valid</span><b class="dia"></b><span class="he" dir="rtl" lang="he">לא נחשב</span></div>
      </div>
      <div id="s6-again" class="s6-call">
        <div class="fr">On relance !</div>
        <div class="alt"><span class="en">Roll again!</span><b class="dia"></b><span class="he" dir="rtl" lang="he">מטילים שוב!</span></div>
      </div>
      <div id="s6-both" class="s6-call">
        <div class="fr">Les deux dés !</div>
        <div class="alt"><span class="en">Both dice!</span><b class="dia"></b><span class="he" dir="rtl" lang="he">שתי הקוביות!</span></div>
      </div>
      <svg id="s6-ok" viewBox="0 0 140 140" data-layout-ignore>
        <circle cx="70" cy="70" r="62" fill="#0b0907" stroke="#c9a36b" stroke-width="5"/>
        <path id="s6-tick" d="M40 72 L62 94 L102 50" fill="none" stroke="#e2c590" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>
      </svg>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      DiceKit.mount(["#s6-dA", "#s6-dB"]);
      const blurIn = (sel, t, d = 0.18) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
      const blurOut = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, t);

      // A die's flight across the felt: plane x/y, height z, spin, and its shadow, which shrinks as the die rises.
      // legs: [t0, t1, x, y, ease] ; hops: [t0, t1, z, ease]
      function fly(die, sh, legs, hops, spins) {
        for (const [t0, t1, x, y, ease] of legs) {
          tl.to([die, sh], { x, y, duration: t1 - t0, ease }, t0);
        }
        for (const [t0, t1, z, ease] of hops) {
          tl.to(die, { z, duration: t1 - t0, ease }, t0);
          tl.to(sh, { scale: 1 - z / 520, opacity: 1 - z / 420, duration: t1 - t0, ease }, t0);
        }
        for (const [t0, t1, r, ease] of spins) tl.to(die, { rotation: r, duration: t1 - t0, ease }, t0);
      }
      const start = (die, sh, x, y) => tl.set([die, sh], { x, y, z: 0, rotation: 0, scale: 1, opacity: 1 }, 0);
      start("#s6-dA", "#s6-shA", 430, 2350);
      start("#s6-dB", "#s6-shB", 590, 2380);
      tl.set(["#s6-shA", "#s6-shB"], { z: 0 }, 0);

      // Beats 0-1: wipe in, the rule and the wall label
      tl.fromTo("#s6-all", { "--wx": "-120px" }, { "--wx": "1200px", duration: 0.5, ease: "power2.inOut" }, 0);
      tl.fromTo("#s6-num", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.3);
      tl.fromTo("#s6-h .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.085, ease: "power2.out" }, 0.42);
      blurIn("#s6-h-alt", 0.75);
      blurIn("#s6-wl", 1.0);
      blurIn("#s6-wl-alt", 1.15);
      tl.fromTo("#s6-wallhi", { opacity: 0 }, { opacity: 0.55, duration: 0.25, ease: "power2.out" }, 1.0);
      tl.to("#s6-wallhi", { opacity: 0.18, duration: 0.4, ease: "power2.inOut" }, 1.6);

      // Throw 1 (beats 1-6): A reaches the wall, B stops short. Freeze, not valid, roll again, rewind.
      fly("#s6-dA", "#s6-shA",
        [[0.625, 1.55, 400, 128, "power1.out"], [1.55, 2.05, 362, 520, "expo.out"]],
        [[0.625, 1.05, 240, "power2.out"], [1.05, 1.55, 0, "power2.in"]],
        [[0.625, 1.55, 540, "none"], [1.55, 2.05, 600, "power2.out"]]);
      fly("#s6-dB", "#s6-shB",
        [[0.625, 1.45, 565, 905, "power2.out"], [1.45, 1.8, 575, 830, "power2.out"]],
        [[0.625, 0.98, 190, "power2.out"], [0.98, 1.45, 0, "power2.in"]],
        [[0.625, 1.45, -420, "none"], [1.45, 1.8, -450, "power2.out"]]);
      DiceKit.tumble(tl, "#s6-dA", 0.625, 1.9, 4, 1 / 12, 0);
      DiceKit.tumble(tl, "#s6-dB", 0.625, 1.6, 2, 1 / 12, 2);
      tl.fromTo("#s6-miss polyline", { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: "power1.out" }, 2.12);
      tl.fromTo("#s6-ring", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.2);
      blurIn("#s6-x", 2.3);
      blurOut("#s6-x", 2.86);
      blurIn("#s6-again", 2.98);
      tl.to(["#s6-miss polyline", "#s6-ring"], { opacity: 0, duration: 0.18, ease: "power1.in" }, 3.15);
      tl.fromTo(["#s6-dA", "#s6-dB"], { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, 3.18);
      tl.to(["#s6-dA", "#s6-shA"], { x: 430, y: 2350, duration: 0.52, ease: "power2.inOut" }, 3.18);
      tl.to(["#s6-dB", "#s6-shB"], { x: 590, y: 2380, duration: 0.52, ease: "power2.inOut" }, 3.18);
      tl.to(["#s6-dA", "#s6-dB"], { rotation: 0, duration: 0.52, ease: "power2.inOut" }, 3.18);
      DiceKit.setFace(tl, "#s6-dA", 1, 3.7);
      DiceKit.setFace(tl, "#s6-dB", 6, 3.7);
      blurOut("#s6-again", 3.9);

      // Throw 2 (beats 6-14): both dice hit the wall, on beats 8 and 9, and come back onto the felt
      fly("#s6-dA", "#s6-shA",
        [[3.75, 5.0, 380, 128, "power1.out"], [5.0, 5.7, 330, 700, "expo.out"]],
        [[3.75, 4.35, 260, "power2.out"], [4.35, 5.0, 0, "power2.in"]],
        [[3.75, 5.0, 600, "none"], [5.0, 5.7, 660, "power2.out"]]);
      fly("#s6-dB", "#s6-shB",
        [[3.75, 5.625, 610, 128, "power1.out"], [5.625, 6.35, 680, 820, "expo.out"]],
        [[3.75, 4.6, 230, "power2.out"], [4.6, 5.625, 0, "power2.in"]],
        [[3.75, 5.625, -660, "none"], [5.625, 6.35, -700, "power2.out"]]);
      DiceKit.tumble(tl, "#s6-dA", 3.75, 5.5, 3, 1 / 12, 1);
      DiceKit.tumble(tl, "#s6-dB", 3.75, 6.1, 5, 1 / 12, 4);
      tl.to("#s6-pa1", { strokeDashoffset: 0, duration: 1.25, ease: "power1.out" }, 3.75);
      tl.to("#s6-pa2", { strokeDashoffset: 0, duration: 0.7, ease: "expo.out" }, 5.0);
      tl.to("#s6-pb1", { strokeDashoffset: 0, duration: 1.875, ease: "power1.out" }, 3.75);
      tl.to("#s6-pb2", { strokeDashoffset: 0, duration: 0.725, ease: "expo.out" }, 5.625);
      for (const t of [5.0, 5.625]) {
        tl.to("#s6-wallhi", { opacity: 0.75, duration: 0.06, ease: "power1.out" }, t);
        tl.to("#s6-wallhi", { opacity: 0.18, duration: 0.3, ease: "power2.in" }, t + 0.08);
      }
      blurIn("#s6-both", 5.05);
      tl.fromTo("#s6-ok", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.4)" }, 6.875);
      tl.to("#s6-tick", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 6.95);
      window.__timelines["s6"] = tl;
    })();
  </script>
</template>
