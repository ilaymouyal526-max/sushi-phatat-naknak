<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script src="../assets/vendor/three.min.js"></script></head>
<body><canvas id="c"></canvas>
<script>
// v6 hand (run by render_props.js): the thrower's right hand seen from the back, like the man in the opening clips
// (navy blazer, white shirt cuff, gold cufflink).
//
// v5 built the hand from separate cylinders and spheres, so every joint showed a seam. Here the hand is one signed
// distance field: round cones for the bones, smooth-unioned into the palm, raymarched in a fragment shader. Skin uses
// wrap lighting with a red terminator (a cheap stand-in for subsurface scattering), plus soft shadows and AO.
const T = THREE;
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);

const V = (x, y, z) => new T.Vector3(x, y, z);
// Digits: base joint, splay-free "up", bone lengths, radii at each joint (base → tip).
const FINGERS = [
  { base: V(-0.275, 0.40, 0.0), len: [0.43, 0.25, 0.20], rad: [0.092, 0.083, 0.074, 0.066] }, // index
  { base: V(-0.090, 0.43, 0.0), len: [0.47, 0.28, 0.21], rad: [0.096, 0.086, 0.077, 0.068] }, // middle
  { base: V(0.100, 0.41, 0.0), len: [0.44, 0.27, 0.20], rad: [0.090, 0.081, 0.073, 0.065] },  // ring
  { base: V(0.275, 0.34, -0.01), len: [0.34, 0.21, 0.18], rad: [0.078, 0.071, 0.064, 0.058] }, // pinky
];
// Poses: per finger [splay, flex1, flex2, flex3] (positive flex curls towards the palm, away from the camera);
// thumb: direction, nail side, [flex1, flex2, flex3]; rot: the whole hand (Euler XYZ).
const POSES = {
  open:    { f: [[0.17, 0.10, 0.06, 0.04], [0.04, 0.06, 0.05, 0.03], [-0.09, 0.08, 0.06, 0.04], [-0.24, 0.10, 0.08, 0.05]],
             th: { dir: V(-0.80, 0.58, 0.12), back: V(0.25, 0.30, 0.92), flex: [0.05, 0.15, 0.12] }, rot: [-0.16, 0.28, 0.02] },
  release: { f: [[0.10, 0.42, 0.55, 0.30], [0.02, 0.38, 0.52, 0.30], [-0.06, 0.44, 0.56, 0.32], [-0.14, 0.52, 0.60, 0.36]],
             th: { dir: V(-0.70, 0.66, 0.05), back: V(0.25, 0.25, 0.94), flex: [0.15, 0.35, 0.30] }, rot: [-0.12, 0.28, 0.02] },
  fist:    { f: [[0.02, 1.55, 1.75, 1.05], [0.0, 1.58, 1.80, 1.05], [-0.02, 1.55, 1.78, 1.05], [-0.05, 1.50, 1.72, 1.0]],
             th: { dir: V(-0.15, 0.75, -0.62), back: V(-0.55, 0.45, 0.70), flex: [0.25, 0.75, 0.45] }, rot: [-0.30, 0.28, 0.02] },
  flat:    { f: [[0.05, 0.03, 0.02, 0.0], [0.01, 0.02, 0.02, 0.0], [-0.03, 0.03, 0.02, 0.0], [-0.07, 0.05, 0.03, 0.0]],
             th: { dir: V(-0.42, 0.88, -0.05), back: V(0.40, 0.15, 0.90), flex: [0.05, 0.10, 0.05] }, rot: [-0.10, 0.28, 0.02] },
};
const THUMB = { base: V(-0.30, -0.30, -0.04), len: [0.34, 0.25, 0.20], rad: [0.135, 0.105, 0.092, 0.080] };

// Forward kinematics: joint points for the 5 digits (4 each) and each distal bone's nail direction.
function chain(base, up, back, len, flex) {
  const pts = [base.clone()]; let phi = 0, p = base.clone(), nail = back;
  for (let k = 0; k < 3; k++) {
    phi += flex[k];
    const d = up.clone().multiplyScalar(Math.cos(phi)).addScaledVector(back, -Math.sin(phi));
    p = p.clone().addScaledVector(d, len[k]); pts.push(p);
    nail = up.clone().multiplyScalar(Math.sin(phi)).addScaledVector(back, Math.cos(phi));
  }
  return { pts, nail };
}
function rig(pose) {
  const P = POSES[pose], pts = [], rad = [], nails = [];
  FINGERS.forEach((F, i) => {
    const [s, ...flex] = P.f[i];
    const up = V(-Math.sin(s), Math.cos(s), 0), back = V(0, 0, 1);
    const c = chain(F.base, up, back, F.len, flex); pts.push(...c.pts); rad.push(...F.rad); nails.push(c.nail);
  });
  const up = P.th.dir.clone().normalize(), back = P.th.back.clone().sub(up.clone().multiplyScalar(P.th.back.dot(up))).normalize();
  const c = chain(THUMB.base, up, back, THUMB.len, P.th.flex); pts.push(...c.pts); rad.push(...THUMB.rad); nails.push(c.nail);
  const m = new T.Matrix4().makeRotationFromEuler(new T.Euler(...P.rot));
  return { pts, rad, nails, rot: new T.Matrix3().setFromMatrix4(m).invert() };
}

const FRAG = `
precision highp float;
uniform vec2 uRes; uniform vec3 uCam; uniform vec3 uLook; uniform float uFov;
uniform vec3 uP[20]; uniform float uR[20]; uniform vec3 uN[5]; uniform mat3 uRot;
varying vec2 vUv;

float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2; vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv);
  float y2 = y * y * l2; float z2 = z * z * l2; float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
float sdRoundBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
// an elliptic cylinder along y, rounded at the rims
float sdTube(vec3 p, vec2 rxz, float y0, float y1, float r) {
  vec2 q = p.xz / rxz; float d = (length(q) - 1.0) * min(rxz.x, rxz.y);
  vec2 w = vec2(d, abs(p.y - 0.5 * (y0 + y1)) - 0.5 * (y1 - y0)) + r;
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - r;
}

// returns (distance, material): 1 skin, 2 nail, 3 cuff, 4 sleeve, 5 gold
vec2 map(vec3 q) {
  vec3 p = uRot * q;
  // palm: wider at the knuckles, arched across the back
  vec3 pp = p; pp.x /= mix(0.84, 1.0, clamp(pp.y * 0.9 + 0.5, 0.0, 1.0)); pp.z += 0.10 * pp.x * pp.x;
  // (stretched fields are scaled back down so the raymarcher never oversteps)
  float d = sdRoundBox(pp - vec3(0.0, 0.0, -0.03), vec3(0.38, 0.45, 0.105), 0.09) * 0.8;
  // wrist, flattened front to back, starting below the palm so it can't poke through its back
  vec3 pw = p; pw.z /= 0.55;
  d = smin(d, sdRoundCone(pw - vec3(0.0, 0.0, -0.03 / 0.55), vec3(0.0, -0.52, 0.0), vec3(0.0, -1.0, 0.0), 0.31, 0.285) * 0.55, 0.14);
  // knuckle bumps on the back of the hand
  for (int i = 0; i < 4; i++) d = smin(d, length(p - (uP[i * 4] + vec3(0.0, 0.0, 0.02))) - uR[i * 4] * 0.66, 0.09);
  float nail = 1e5;
  for (int i = 0; i < 5; i++) {
    float k0 = i == 4 ? 0.14 : 0.07;
    float d0 = sdRoundCone(p, uP[i * 4], uP[i * 4 + 1], uR[i * 4], uR[i * 4 + 1]);
    float d1 = sdRoundCone(p, uP[i * 4 + 1], uP[i * 4 + 2], uR[i * 4 + 1], uR[i * 4 + 2]);
    float d2 = sdRoundCone(p, uP[i * 4 + 2], uP[i * 4 + 3], uR[i * 4 + 2], uR[i * 4 + 3]);
    float df = min(min(d0, d1), d2);
    d = i == 4 ? smin(d, df, k0) : min(smin(d, d0, k0), df);
    // the nail: a thin slab on the back of the last bone, raised a hair above the skin
    vec3 a = uP[i * 4 + 2], b = uP[i * 4 + 3], ax = normalize(b - a), n = normalize(uN[i]);
    vec3 rel = p - b; float along = dot(rel, ax);
    vec3 side = normalize(cross(ax, n));
    float r = uR[i * 4 + 3];
    vec3 nc = vec3(dot(rel, side), along + r * 0.55, dot(rel, n) - r * 0.62);
    nail = min(nail, sdRoundBox(nc, vec3(r * 0.66, r * 0.95, r * 0.18), r * 0.16));
  }
  vec2 res = vec2(d, 1.0);
  if (nail < res.x + 0.002) res = vec2(min(nail, res.x), 2.0);
  float cuff = sdTube(p, vec2(0.40, 0.27), -1.14, -0.84, 0.035);
  if (cuff < res.x) res = vec2(cuff, 3.0);
  float sleeve = sdTube(p, vec2(0.49, 0.36), -4.2, -1.02, 0.06);
  if (sleeve < res.x) res = vec2(sleeve, 4.0);
  // the cufflink: a domed gold disc on the side of the cuff
  vec3 pl = p - vec3(0.33, -0.95, 0.17);
  float link = max(length(pl * vec3(1.0, 1.0, 2.2)) - 0.05, -pl.x - 0.0);
  if (link < res.x) res = vec2(link, 5.0);
  return res;
}
vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0008, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x, map(p + e.yxy).x - map(p - e.yxy).x, map(p + e.yyx).x - map(p - e.yyx).x));
}
float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 48; i++) { float h = map(ro + rd * t).x; res = min(res, 6.0 * h / t); t += clamp(h, 0.01, 0.2); if (res < 0.002 || t > 4.0) break; }
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n) {
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++) { float h = 0.03 * float(i); o += (h - map(p + n * h).x) * s; s *= 0.7; }
  return clamp(1.0 - 2.2 * o, 0.0, 1.0);
}
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }  // colours below are written in sRGB
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

void main() {
  vec2 uv = (vUv * 2.0 - 1.0) * vec2(uRes.x / uRes.y, 1.0);
  vec3 fw = normalize(uLook - uCam), rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw);
  vec3 rd = normalize(fw + (uv.x * rt + uv.y * up) * tan(radians(uFov) * 0.5));
  float t = 3.0; vec2 h = vec2(1.0, 0.0);
  for (int i = 0; i < 220; i++) { h = map(uCam + rd * t); if (h.x < 0.0004 * t || t > 10.0) break; t += h.x * 0.9; }
  if (t > 10.0) { gl_FragColor = vec4(0.0); return; }
  vec3 p = uCam + rd * t, n = normalAt(p), v = -rd;
  vec3 L1 = normalize(vec3(-2.5, 6.0, 3.5)), L2 = normalize(vec3(3.0, 2.0, -4.0)), L3 = normalize(vec3(2.0, 0.5, 3.0));
  float sh = softShadow(p + n * 0.003, L1), occ = ao(p, n);
  vec3 col;
  float m = h.y;
  if (m < 1.5) {
    float nz = noise(p * 38.0) * 0.25 + noise(p * 9.0) * 0.75;
    vec3 alb = mix(vec3(0.80, 0.58, 0.47), vec3(0.86, 0.65, 0.53), nz);
    // redder at the knuckles and finger joints
    vec3 hp = uRot * p; float red = 0.0;
    for (int i = 0; i < 20; i++) red = max(red, 1.0 - smoothstep(0.0, 0.07, length(hp - uP[i]) - uR[i]));
    alb = mix(alb, vec3(0.82, 0.52, 0.44), red * 0.45); alb = lin(alb);
    float ndl = dot(n, L1);
    float wrap = max(0.0, (ndl + 0.45) / 1.45);
    vec3 sss = mix(vec3(1.0, 0.62, 0.52), vec3(1.0), smoothstep(0.0, 0.5, ndl));
    col = alb * sss * wrap * mix(0.3, 1.0, sh) * vec3(1.0, 0.93, 0.84) * 1.25;
    col += alb * vec3(0.55, 0.62, 0.80) * max(0.0, dot(n, L2)) * 0.35;
    col += alb * vec3(1.0, 0.9, 0.8) * max(0.0, dot(n, L3)) * 0.25;
    col += alb * vec3(0.22, 0.16, 0.13) * occ;
    vec3 hv = normalize(L1 + v); col += vec3(1.0, 0.95, 0.9) * pow(max(0.0, dot(n, hv)), 28.0) * 0.10 * sh;
    float fres = pow(1.0 - max(0.0, dot(n, v)), 4.0); col += vec3(0.75, 0.80, 1.0) * fres * 0.10;
  } else if (m < 2.5) {
    vec3 alb = lin(vec3(0.90, 0.70, 0.62));
    col = alb * (max(0.0, (dot(n, L1) + 0.3) / 1.3) * mix(0.4, 1.0, sh) + 0.25 * occ);
    vec3 hv = normalize(L1 + v); col += vec3(1.0) * pow(max(0.0, dot(n, hv)), 80.0) * 0.5 * sh;
  } else if (m < 3.5) {
    vec3 alb = lin(vec3(0.94, 0.93, 0.90));
    float weave = 0.96 + 0.04 * noise(p * vec3(160.0, 40.0, 160.0));
    col = alb * weave * (max(0.0, (dot(n, L1) + 0.2) / 1.2) * mix(0.45, 1.0, sh) + 0.22 * occ);
    col += alb * vec3(0.55, 0.62, 0.80) * max(0.0, dot(n, L2)) * 0.2;
  } else if (m < 4.5) {
    vec3 alb = lin(vec3(0.11, 0.15, 0.27));
    float twill = 0.9 + 0.1 * noise(vec3(p.x * 120.0 + p.y * 120.0, p.y * 30.0, p.z * 120.0));
    float sheen = pow(1.0 - max(0.0, dot(n, v)), 2.0);
    col = alb * twill * (max(0.0, dot(n, L1)) * mix(0.4, 1.0, sh) * 1.4 + 0.35 * occ) + vec3(0.12, 0.16, 0.30) * sheen * 0.25;
    col += vec3(0.20, 0.26, 0.45) * max(0.0, dot(n, L2)) * 0.18;
  } else {
    vec3 gold = lin(vec3(0.95, 0.74, 0.40));
    vec3 r = reflect(-v, n);
    float env = 0.35 + 0.65 * smoothstep(-0.2, 0.8, r.y);
    col = gold * (0.25 + 0.9 * max(0.0, dot(n, L1)) + env * 0.6);
    col += vec3(1.0, 0.95, 0.8) * pow(max(0.0, dot(n, normalize(L1 + v))), 60.0);
  }
  // ACES-ish tone map and sRGB
  col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
  gl_FragColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

const VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const mat = new T.ShaderMaterial({
  vertexShader: VERT, fragmentShader: FRAG,
  uniforms: { uRes: { value: new T.Vector2() }, uCam: { value: V(0.20, 0.75, 6.0) }, uLook: { value: V(-0.15, 0.4, 0) }, uFov: { value: 30 },
    uP: { value: [] }, uR: { value: [] }, uN: { value: [] }, uRot: { value: new T.Matrix3() } },
});
const quad = new T.Mesh(new T.PlaneGeometry(2, 2), mat);
const scene = new T.Scene(); scene.add(quad);
const cam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Render at ss x the size, then downsample: that is the antialiasing.
// The frame is 800 x 1760: the top 1280 px hold the hand, the rest is sleeve, long enough to run off the screen
// edge wherever the hand is placed. The camera keeps the scale of an 800 x 1280 frame at 30 degrees.
window.renderHand = (pose, w = 800, h = 1760, ss = 2) => {
  const r = rig(pose);
  const t15 = Math.tan(Math.PI / 12), drop = ((h - 1280) / 2) * (2 * 6 * t15 / 1280);
  mat.uniforms.uFov.value = 2 * Math.atan(t15 * h / 1280) * 180 / Math.PI;
  mat.uniforms.uCam.value.set(0.20, 0.75 - drop, 6.0); mat.uniforms.uLook.value.set(-0.15, 0.4 - drop, 0);
  Object.assign(mat.uniforms.uP, { value: r.pts }); mat.uniforms.uR.value = r.rad; mat.uniforms.uN.value = r.nails; mat.uniforms.uRot.value = r.rot;
  mat.uniforms.uRes.value.set(w * ss, h * ss);
  renderer.setSize(w * ss, h * ss, false); renderer.render(scene, cam);
  const out = document.createElement("canvas"); out.width = w; out.height = h;
  const g = out.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(canvas, 0, 0, w, h);
  return out.toDataURL("image/png");
};
window.ready = true;
</script></body></html>
