<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script src="../assets/vendor/three.min.js"></script></head>
<body><canvas id="c"></canvas>
<script>
// v6 dice (run by render_props.js). Vegas casino dice: translucent red acrylic, drilled pips filled flush with white
// paint, slightly rounded edges. Rendered with no baked shadow (the film draws the shadow under the die, so it can
// stay on the felt while the die is in the air).
//
// Why not MeshPhysical transmission (v5): the transmission pass blurs whatever is behind the front face, so the far
// pips smeared into pink blobs. Here the body is an alpha-blended shell instead: the opaque pips render first and stay
// crisp, the front faces tint them, and the back faces add the dark-red depth of the acrylic.
const T = THREE;
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = T.SRGBColorSpace;

// Studio environment: two long softboxes give the crisp highlight lines a product shot has on the edges.
function studioEnv() {
  const s = new T.Scene();
  s.background = new T.Color("#160f0c");
  const panel = (w, h, color, x, y, z, ry = 0, rx = 0) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color, side: T.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m); };
  panel(1.4, 7, "#fff4e4", -3.2, 4.5, 1.5, 0.6, -0.9);   // key strip
  panel(6, 1.0, "#ffe2bf", 2.5, 3.5, 3.5, -0.7, -0.5);   // warm fill strip
  panel(5, 5, "#5a4232", 0, 7, 0, 0, Math.PI / 2);        // dim ceiling
  panel(2.2, 1.2, "#fff8ee", -0.6, 6, 2.6, 0, Math.PI / 2 - 0.35); // top-face highlight
  panel(7, 1.0, "#9fb6ff", 0, 2.5, -5, 0, 0.2);           // cool rim
  panel(14, 14, "#2a1a12", 0, -2, 0, 0, Math.PI / 2);     // dark floor
  const pm = new T.PMREMGenerator(renderer);
  return pm.fromScene(s, 0.01).texture;
}
const env = studioEnv();

function roundedBox(w, h, d, r, seg = 24) {
  const g = new T.BoxGeometry(w, h, d, seg, seg, seg), p = g.attributes.position, n = g.attributes.normal;
  const lo = new T.Vector3(-(w / 2 - r), -(h / 2 - r), -(d / 2 - r)), hi = lo.clone().negate(), v = new T.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); const c = v.clone().clamp(lo, hi), dir = v.clone().sub(c).normalize();
    v.copy(c).addScaledVector(dir, r); p.setXYZ(i, v.x, v.y, v.z); n.setXYZ(i, dir.x, dir.y, dir.z);
  }
  return g;
}

const PIPS = { 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]], 4: [[-1, -1], [1, -1], [-1, 1], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], 6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]] };
// standard die: opposite faces add to 7. +y=1, -y=6, +z=2, -z=5, +x=3, -x=4
const FACES = [[1, [0, 1, 0]], [6, [0, -1, 0]], [2, [0, 0, 1]], [5, [0, 0, -1]], [3, [1, 0, 0]], [4, [-1, 0, 0]]];

const OPT = { opacity: 0.95, back: 0.7, r: 0.07 };
function die() {
  const g = new T.Group();
  const geo = roundedBox(1, 1, 1, OPT.r, 14);
  // the far side of the acrylic: dark red, seen through the front
  const back = new T.Mesh(geo, new T.MeshPhysicalMaterial({ color: "#7a0010", emissive: "#3a0006", roughness: 0.2, side: T.BackSide,
    transparent: true, opacity: OPT.back, depthWrite: false, envMapIntensity: 0.6 }));
  back.renderOrder = 1; g.add(back);
  // the front shell: glossy red, clear-coated
  const front = new T.Mesh(geo, new T.MeshPhysicalMaterial({ color: "#e3132f", emissive: "#5c0010", emissiveIntensity: 0.6, roughness: 0.08,
    clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 1, transparent: true, opacity: OPT.opacity, depthWrite: false, envMapIntensity: 1.2 }));
  front.renderOrder = 2; g.add(front);
  const pipM = new T.MeshStandardMaterial({ color: "#ffffff", roughness: 0.32, envMapIntensity: 0.9 });
  for (const [n, nrm] of FACES) {
    const n3 = new T.Vector3(...nrm);
    const a = Math.abs(n3.y) > 0.5 ? new T.Vector3(1, 0, 0) : new T.Vector3(0, 1, 0);
    const b = new T.Vector3().crossVectors(n3, a);
    for (const [u, v] of PIPS[n]) {
      const r = 0.088;
      // a drilled hole filled flush: a short cylinder whose top sits a hair above the face
      const pip = new T.Mesh(new T.CylinderGeometry(r, r, 0.05, 48), pipM);
      pip.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), n3);
      pip.position.copy(n3.clone().multiplyScalar(0.478)).addScaledVector(a, u * 0.27).addScaledVector(b, v * 0.27);
      g.add(pip);
    }
  }
  return g;
}

// Rotation (Euler XYZ) that brings face n up (+y), towards the camera
const UP = { 1: [0, 0, 0], 6: [Math.PI, 0, 0], 2: [-Math.PI / 2, 0, 0], 5: [Math.PI / 2, 0, 0], 3: [0, 0, Math.PI / 2], 4: [0, 0, -Math.PI / 2] };
// Rest pose for each face: the face up, a little yaw so a side face catches light
const restQ = (face, yaw = 0.42) => new T.Quaternion().setFromEuler(new T.Euler(0, yaw, 0)).multiply(new T.Quaternion().setFromEuler(new T.Euler(...UP[face])));

// One frame: camera from above and in front, like a diner looking down at the felt. The die is centred so it can
// spin freely inside the frame; the cube's side spans about half the frame.
const CAM = [0, 3.9, 1.9], LOOK = [0, 0, 0];
const scene = new T.Scene(); scene.environment = env;
const key = new T.DirectionalLight("#fff0dc", 2.2); key.position.set(-2.5, 6, 3.5); scene.add(key);
const rim = new T.DirectionalLight("#b8ccff", 1.0); rim.position.set(3, 2, -4); scene.add(rim);
scene.add(new T.HemisphereLight("#fff0dd", "#3a2418", 0.45));
let D = die(); scene.add(D);
function rebuild() { scene.remove(D); D = die(); scene.add(D); }

function frame(size, q) {
  renderer.setSize(size, size, false);
  const cam = new T.PerspectiveCamera(33, 1, 0.05, 50); cam.position.set(...CAM); cam.lookAt(...LOOK);
  D.quaternion.copy(q); D.position.set(0, 0, 0);
  renderer.render(scene, cam);
}

// Average n sub-frames (motion blur). Colour is accumulated premultiplied, so the edges blend correctly.
function blurred(size, qs) {
  const acc = new Float32Array(size * size * 4);
  const tmp = document.createElement("canvas"); tmp.width = tmp.height = size; const g = tmp.getContext("2d", { willReadFrequently: true });
  for (const q of qs) {
    frame(size, q); g.clearRect(0, 0, size, size); g.drawImage(canvas, 0, 0);
    const d = g.getImageData(0, 0, size, size).data;
    for (let i = 0; i < d.length; i += 4) { const a = d[i + 3] / 255; acc[i] += d[i] * a; acc[i + 1] += d[i + 1] * a; acc[i + 2] += d[i + 2] * a; acc[i + 3] += a; }
  }
  const out = g.createImageData(size, size), n = qs.length;
  for (let i = 0; i < acc.length; i += 4) { const a = acc[i + 3]; out.data[i] = a ? acc[i] / a : 0; out.data[i + 1] = a ? acc[i + 1] / a : 0; out.data[i + 2] = a ? acc[i + 2] / a : 0; out.data[i + 3] = (a / n) * 255; }
  g.putImageData(out, 0, 0); return tmp;
}

// A tumble that lands on `face`: rotation about a tilted rolling axis, decelerating (cubic ease-out) to rest.
// Frame k of N shows time k/(N-1). Shutter: a quarter frame.
// Two variants per face (a, b) with different rolling axes and rest yaw, so a double never looks like a mirror copy.
const AXES = { a: { 1: [1, 0.25, 0.55], 2: [0.6, -0.2, 1], 3: [1, 0.4, -0.5], 4: [-0.7, 0.3, 1], 5: [1, -0.35, 0.3], 6: [-0.4, 0.2, -1] },
               b: { 1: [-0.5, 0.3, 1], 2: [1, 0.2, -0.4], 3: [-0.3, -0.25, 1], 4: [1, 0.35, 0.2], 5: [-0.6, 0.2, -1], 6: [1, -0.3, 0.45] } };
const YAW = { a: 0.42, b: -0.3 };
function tumbleQ(face, t, v = "a", turns = 2.25) {
  const e = 1 - Math.pow(1 - t, 3);
  const ax = new T.Vector3(...AXES[v][face]).normalize();
  return restQ(face, YAW[v]).multiply(new T.Quaternion().setFromAxisAngle(ax, -turns * 2 * Math.PI * (1 - e)));
}

window.renderStill = (face, v = "a", size = 1024) => { frame(size, restQ(face, YAW[v])); return canvas.toDataURL("image/png"); };
window.renderStrip = (face, v = "a", size = 512, N = 24, cols = 6, sub = 6) => {
  const rows = Math.ceil(N / cols);
  const sheet = document.createElement("canvas"); sheet.width = cols * size; sheet.height = rows * size; const sg = sheet.getContext("2d");
  for (let k = 0; k < N; k++) {
    const t0 = k / (N - 1), dt = 0.25 / (N - 1), qs = [];
    for (let s = 0; s < sub; s++) qs.push(tumbleQ(face, Math.min(1, t0 + dt * (s / (sub - 1) - 0.5)), v));
    sg.drawImage(blurred(size, qs), (k % cols) * size, Math.floor(k / cols) * size);
  }
  return sheet.toDataURL("image/webp", 0.92);  // a fifth of the PNG size
};
window.setOpt = (o) => { Object.assign(OPT, o); rebuild(); };
window.ready = true;
</script></body></html>
