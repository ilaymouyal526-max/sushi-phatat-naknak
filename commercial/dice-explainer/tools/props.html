<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Heebo"; font-weight: 100 900; src: url('../assets/fonts/heebo-normal-hebrew.woff2') format('woff2'); }
@font-face { font-family: "HeeboL"; font-weight: 100 900; src: url('../assets/fonts/heebo-normal-latin.woff2') format('woff2'); }
@font-face { font-family: "Frank Ruhl"; font-weight: 300 900; src: url('../assets/fonts/frankruhl-normal-hebrew.woff2') format('woff2'); }
html,body{margin:0;background:transparent}canvas{display:block}
</style>
<script src="../assets/vendor/three.min.js"></script></head>
<body><canvas id="c"></canvas>
<script>
// v6 props (run by render_props.js): the paper receipt and the gold tip coin. The dice are in dice.html, the hand
// in hand.html. Real 3D, a warm key light, a cool rim and a soft shadow on an invisible catcher.
const T = THREE;
const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;

function studioEnv(gold = false) {
  const s = new T.Scene();
  s.background = new T.Color("#160f0c");
  const panel = (w, h, color, x, y, z, ry = 0, rx = 0) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color, side: T.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); s.add(m); };
  panel(1.6, 7, "#fff4e4", -3.2, 4.5, 1.5, 0.6, -0.9);
  panel(6, 1.2, "#ffe2bf", 2.5, 3.5, 3.5, -0.7, -0.5);
  panel(5, 5, "#6a5040", 0, 7, 0, 0, Math.PI / 2);
  panel(2.4, 1.4, "#fff8ee", -0.6, 6, 2.6, 0, Math.PI / 2 - 0.35);
  panel(7, 1.0, "#9fb6ff", 0, 2.5, -5, 0, 0.2);
  panel(14, 14, "#2a1a12", 0, -2, 0, 0, Math.PI / 2);
  // for the coin: a big warm softbox up and behind, which a flat coin face mirrors towards the camera
  if (gold) { panel(7, 3, "#fff1d6", 0, 4.5, -4.5, 0, 0.75); panel(3, 3, "#ffe7bf", -4, 3, 0, Math.PI / 2, 0); }
  const pm = new T.PMREMGenerator(renderer);
  return pm.fromScene(s, 0.01).texture;
}
const env = studioEnv(), goldEnv = studioEnv(true);

function stage(w, h, camPos, look, fov = 30) {
  renderer.setSize(w, h, false);
  const scene = new T.Scene(); scene.environment = env;
  const cam = new T.PerspectiveCamera(fov, w / h, 0.05, 50); cam.position.set(...camPos); cam.lookAt(...look);
  const key = new T.DirectionalLight("#ffe9cf", 2.4); key.position.set(-2.5, 6, 3.5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -0.0008; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
  scene.add(key);
  const rim = new T.DirectionalLight("#b8ccff", 1.0); rim.position.set(3, 2, -4); scene.add(rim);
  scene.add(new T.HemisphereLight("#fff0dd", "#3a2418", 0.5));
  const catcher = new T.Mesh(new T.PlaneGeometry(20, 20), new T.ShadowMaterial({ opacity: 0.32 })); catcher.rotation.x = -Math.PI / 2; catcher.receiveShadow = true; scene.add(catcher);
  return { scene, cam, catcher };
}

// ---------- the receipt: thermal paper, Hebrew, no prices ----------
let rnd; const seed = (s) => { rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647); };
function loadImg(src) { return new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; }); }

async function receiptTex(W, H) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  seed(11);
  // thermal paper: cool white, faint grain and fibres
  g.fillStyle = "#f6f3ec"; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 26000; i++) { g.fillStyle = `rgba(110,100,90,${rnd() * 0.05})`; g.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 1.5, 1); }
  // torn top and bottom edges (alpha)
  const ink = "#24201c";
  const logo = await loadImg("../assets/img/logo-ink.svg");
  const lw = 230; g.drawImage(logo, (W - lw) / 2, 70, lw, lw * 1.3);
  g.fillStyle = ink; g.textAlign = "center"; g.direction = "rtl";
  g.font = "500 34px Heebo"; g.fillText("אחוזה 124, רעננה", W / 2, 420);
  const dashes = (y) => { g.save(); g.strokeStyle = ink; g.lineWidth = 3; g.setLineDash([12, 9]); g.beginPath(); g.moveTo(60, y); g.lineTo(W - 60, y); g.stroke(); g.restore(); };
  dashes(460);
  g.font = "700 38px Heebo"; g.fillText("חשבון לשולחן", W / 2, 520);
  dashes(552);
  g.textAlign = "right"; g.font = "400 36px Heebo";
  const items = ["אדממה במלח ים", "גיוזה עוף", "סלמון טאטאקי", "פאד תאי", "רול יוקו ספיישל", "ראמן מיסו", "מוצ'י מנגו", "סאקה חם"];
  items.forEach((t, i) => g.fillText(t, W - 70, 610 + i * 58));
  dashes(610 + items.length * 58 - 14);
  g.font = "700 40px Heebo"; g.fillText("לתשלום", W - 70, 610 + items.length * 58 + 46);
  // barcode
  const by = 610 + items.length * 58 + 100; let x = 150;
  while (x < W - 150) { const w = 2 + Math.floor(rnd() * 5); g.fillStyle = ink; g.fillRect(x, by, w, 86); x += w + 2 + Math.floor(rnd() * 5); }
  g.textAlign = "center"; g.font = "500 32px Heebo"; g.fillText("תודה, ובהצלחה בקוביות!", W / 2, by + 140);
  // thermal print is never perfectly black: a slight fade across the roll
  const fade = g.createLinearGradient(0, 0, W, 0); fade.addColorStop(0, "rgba(246,243,236,.18)"); fade.addColorStop(0.5, "rgba(246,243,236,0)"); fade.addColorStop(1, "rgba(246,243,236,.12)");
  g.fillStyle = fade; g.fillRect(0, 0, W, H);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 16;
  // alpha: zig-zag tear at both ends
  const a = document.createElement("canvas"); a.width = W; a.height = H; const ag = a.getContext("2d");
  ag.fillStyle = "#fff"; ag.beginPath(); ag.moveTo(0, 14);
  for (let k = 0; k <= 40; k++) ag.lineTo((k / 40) * W, k % 2 ? 0 : 16 + rnd() * 6);
  for (let k = 40; k >= 0; k--) ag.lineTo((k / 40) * W, k % 2 ? H : H - 16 - rnd() * 6);
  ag.closePath(); ag.fill();
  const at = new T.CanvasTexture(a);
  return { map: t, alpha: at, H: by + 200 };
}
window.renderReceipt = async (W = 900, H = 1300) => {
  const { scene, cam } = stage(W, H, [0, 9.2, 0.55], [0, 0, -0.12], 30);
  const tw = 760, th = 1400, tex = await receiptTex(tw, th);
  const pw = 2.2, ph = pw * th / tw;
  const geo = new T.PlaneGeometry(pw, ph, 60, 120), p = geo.attributes.position;
  // the roll's memory: it curls up at the top, ripples gently, and the long edges lift a little
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), top = ph / 2 - 0.55;
    p.setZ(i, 0.03 * Math.sin(y * 2.3 + 0.6) + 0.045 * x * x + (y > top ? 0.32 * Math.pow((y - top) / 0.55, 2.2) : 0));
  }
  geo.computeVertexNormals();
  const paper = new T.Mesh(geo, new T.MeshStandardMaterial({ map: tex.map, alphaMap: tex.alpha, transparent: true, alphaTest: 0.5, roughness: 0.82, side: T.DoubleSide }));
  paper.rotation.x = -Math.PI / 2; paper.rotation.z = 0.05; paper.position.y = 0.2; paper.castShadow = true; scene.add(paper);
  renderer.render(scene, cam); return canvas.toDataURL("image/png");
};

// ---------- the coin: struck gold, reeded edge, a raised rim and the logo's mountains in relief ----------
function coinBump(S) {
  const c = document.createElement("canvas"); c.width = c.height = S; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, S, S);
  const r = S / 2;
  g.fillStyle = "#fff"; g.beginPath(); g.arc(r, r, r * 0.96, 0, Math.PI * 2); g.fill(); // rim
  g.fillStyle = "#000"; g.beginPath(); g.arc(r, r, r * 0.84, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#bbb"; g.lineWidth = S * 0.006; g.beginPath(); g.arc(r, r, r * 0.76, 0, 7); g.stroke();       // inner bead
  for (let k = 0; k < 64; k++) { const a = k / 64 * Math.PI * 2; g.fillStyle = "#999"; g.beginPath(); g.arc(r + Math.cos(a) * r * 0.80, r + Math.sin(a) * r * 0.80, S * 0.006, 0, 7); g.fill(); }
  // mountains and the sun, from the logo
  g.fillStyle = "#fff";
  g.beginPath(); g.moveTo(r - r * 0.5, r + r * 0.25); g.lineTo(r - r * 0.18, r - r * 0.22); g.lineTo(r - r * 0.02, r + r * 0.02); g.lineTo(r + r * 0.16, r - r * 0.34); g.lineTo(r + r * 0.52, r + r * 0.25); g.closePath(); g.fill();
  g.fillStyle = "#000"; g.beginPath(); g.moveTo(r - r * 0.27, r - r * 0.08); g.lineTo(r - r * 0.18, r - r * 0.22); g.lineTo(r - r * 0.10, r - r * 0.10); g.lineTo(r - r * 0.14, r - r * 0.06); g.closePath(); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(r + r * 0.36, r - r * 0.42, r * 0.11, 0, 7); g.fill();
  g.fillRect(r - r * 0.5, r + r * 0.36, r, r * 0.05); g.fillRect(r - r * 0.36, r + r * 0.47, r * 0.72, r * 0.05);
  g.filter = "blur(2px)"; g.drawImage(c, 0, 0); g.filter = "none";
  return new T.CanvasTexture(c);
}
const GOLD = () => new T.MeshPhysicalMaterial({ color: "#ffcf70", metalness: 1, roughness: 0.28, clearcoat: 0.3, clearcoatRoughness: 0.2, envMapIntensity: 1.6 });
function coin() {
  const g = new T.Group(), R = 0.62, H = 0.085;
  const faceM = GOLD(); faceM.bumpMap = coinBump(1024); faceM.bumpScale = 3.0;
  // the edge: 120 reeds
  const edge = new T.CylinderGeometry(R, R, H, 240, 1, true), p = edge.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), a = Math.atan2(z, x), k = 1 + 0.012 * Math.max(0, Math.cos(a * 120)); p.setX(i, x * k); p.setZ(i, z * k); }
  edge.computeVertexNormals();
  const e = new T.Mesh(edge, GOLD()); e.castShadow = true; g.add(e);
  for (const s of [1, -1]) {
    const f = new T.Mesh(new T.CircleGeometry(R, 128), faceM); f.rotation.x = -s * Math.PI / 2; f.position.y = s * H / 2; f.castShadow = true; g.add(f);
  }
  return g;
}
window.renderCoin = (tilt = 0, spin = 0, W = 600, H = 450) => {
  const { scene, cam } = stage(W, H, [0, 2.6, 2.2], [0, 0.2, 0], 30);
  scene.environment = goldEnv;
  const c = coin(); c.position.y = 0.05 + Math.abs(Math.sin(tilt)) * 0.6; c.rotation.set(0, spin, tilt); scene.add(c);
  renderer.render(scene, cam); return canvas.toDataURL("image/png");
};
document.fonts.load("500 30px Heebo").then(() => document.fonts.load("700 30px Heebo")).then(() => { window.ready = true; });
</script></body></html>
